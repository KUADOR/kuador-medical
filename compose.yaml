# Local environment for Medical Kuador.
#   docker compose up -d db mailpit      -> PostgreSQL and Mailpit (run api and web from the host)
#   docker compose --profile full up -d  -> PostgreSQL + api + web in containers
# Values come from .env (copy .env.example). Never commit .env.
name: medical-kuador

services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-medical}
      POSTGRES_USER: ${DB_USERNAME:-medical}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env (copy .env.example)}
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      # PostgreSQL 18 images keep data under /var/lib/postgresql/<major>/docker
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 20

  # Local SMTP server that catches every email (invitations, password reset). Never used outside local.
  mailpit:
    image: axllent/mailpit:v1.29
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MAILPIT_SMTP_PORT:-1025}:1025"
      - "127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    profiles: [full]
    build:
      context: ./api
    restart: unless-stopped
    env_file:
      - path: .env
        required: true
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-local}
      # Inside the compose network the database host is "db", not localhost.
      DB_URL: jdbc:postgresql://db:5432/${DB_NAME:-medical}
      # The container always listens on 8080; the host port is API_PORT.
      SERVER_PORT: "8080"
      SERVER_ADDRESS: 0.0.0.0
      KUADOR_SMTP_HOST: mailpit
      KUADOR_SMTP_PORT: "1025"
    ports:
      - "127.0.0.1:${API_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started

  web:
    profiles: [full]
    build:
      context: ./web
    restart: unless-stopped
    environment:
      # Public values for .well-known/assetlinks.json and apple-app-site-association (empty: no app).
      APP_LINKS_ANDROID_PACKAGE: ${APP_LINKS_ANDROID_PACKAGE:-}
      APP_LINKS_ANDROID_SHA256: ${APP_LINKS_ANDROID_SHA256:-}
      APP_LINKS_IOS_APP_IDS: ${APP_LINKS_IOS_APP_IDS:-}
    ports:
      - "127.0.0.1:${WEB_PORT:-4200}:8080"
    depends_on:
      - api

volumes:
  db-data:
