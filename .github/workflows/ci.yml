# CI per piece. Protected branches require the jobs «ci», «api», «web», «movil», «contract»,
# «design», «web-visual» and «web-lighthouse».
# Path filters run inside the workflow (job «changes») so that a job whose piece did not change
# ends as «skipped», which GitHub treats as passing for required checks.
name: ci
on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Methodology documents
        run: |
          for f in "AGENTS.md" "docs/architecture.md" ".specify/memory/constitution.md" "docs/deployment.md" "docs/glossary.md" "PRODUCT.md"; do
            test -f "$f" || { echo "Missing $f"; exit 1; }
          done

  changes:
    name: changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      api: ${{ steps.filter.outputs.api }}
      web: ${{ steps.filter.outputs.web }}
      movil: ${{ steps.filter.outputs.movil }}
      contract: ${{ steps.filter.outputs.contract }}
      design: ${{ steps.filter.outputs.design }}
    steps:
      - uses: actions/checkout@v7
      - id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            shared: &shared
              - '.github/workflows/ci.yml'
            api:
              - *shared
              - 'api/**'
              - 'contracts/**'
            web:
              - *shared
              - 'web/**'
              - 'contracts/**'
            movil:
              - *shared
              - 'movil/**'
              - 'contracts/**'
            contract:
              - *shared
              - 'contracts/**'
              - 'redocly.yaml'
              - '.redocly.lint-ignore.yaml'
            # Token sources and the generated outputs: a hand edit of an output is drift too.
            design:
              - *shared
              - 'design/**'
              - 'web/src/styles/tokens.css'
              - 'movil/lib/design_system/tokens.g.dart'

  api:
    name: api
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      # Docker is available on ubuntu-latest; Testcontainers starts PostgreSQL with the «test» profile.
      - name: Build and test
        run: ./mvnw -B verify

  web:
    name: web
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Generated API types match the contract
        run: npm run api:check
      - run: npm run build
      - name: App Links / Universal Links files are valid and bundled
        run: |
          for f in assetlinks.json apple-app-site-association; do
            node -e 'JSON.parse(require("fs").readFileSync(process.argv[1], "utf8"))' "dist/web/browser/.well-known/$f" \
              || { echo "Invalid or missing .well-known/$f"; exit 1; }
          done
      - name: App Links entrypoint writes valid files
        run: scripts/test-app-links.sh
      - run: npm test -- --watch=false

  web-visual:
    name: web-visual
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Same image as «npm run test:visual:docker», so baselines match pixel for pixel.
    # Keep the tag equal to «@playwright/test» in web/package.json (checked below).
    container:
      image: mcr.microsoft.com/playwright:v1.65.1-noble
      options: --ipc=host
    env:
      PLAYWRIGHT_VERSION: 1.65.1
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - name: Playwright image matches the package version
        run: test "$(node -p 'require("./package.json").devDependencies["@playwright/test"]')" = "$PLAYWRIGHT_VERSION"
      - run: npm ci
      # web/playwright.config.ts: dev server with a simulated API (page.route), synthetic data only.
      - name: Visual regression and axe-core (Playwright)
        run: npm run test:visual
      - name: Render proposed snapshots
        if: failure()
        run: npm run test:visual:update || true
      - name: Upload report and snapshots
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: web-visual-linux
          path: |
            web/playwright-report/
            web/e2e/visual/__screenshots__/
          retention-days: 7

  web-lighthouse:
    name: web-lighthouse
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build
      # web/lighthouserc.json: Lighthouse mobile profile on the production build, 3 runs,
      # median LCP must stay under 2.5 s (SC-010). Uses the Chrome of the runner.
      - name: Lighthouse CI
        run: npm run lighthouse
      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: web-lighthouse
          path: web/.lighthouseci/
          retention-days: 7
          if-no-files-found: ignore

  movil:
    name: movil
    needs: changes
    if: needs.changes.outputs.movil == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: movil
    steps:
      - uses: actions/checkout@v7
      # Pinned for reproducible analysis: 3.50 deprecates package:flutter/material.dart.
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.9'
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      # Includes the golden tests (tag «golden», test/goldens/): baselines are rendered on Linux.
      - run: flutter test
      # On failure, render the goldens again on this runner and upload them with the diffs, so a
      # reviewed visual change can update its baselines without a local Linux setup.
      - name: Render proposed goldens
        if: failure()
        run: flutter test --tags golden --update-goldens || true
      - name: Upload goldens and diffs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: movil-goldens-linux
          path: |
            movil/test/**/*.png
          retention-days: 7

  design:
    name: design
    needs: changes
    if: needs.changes.outputs.design == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: design
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: design/package-lock.json
      - run: npm ci
      - name: Generator tests
        run: npm test
      # Regenerates CSS and Dart from design/tokens/ (contract and AA contrast included) and fails
      # if the versioned outputs differ: change the tokens and run «npm run build», never edit
      # web/src/styles/tokens.css or movil/lib/design_system/tokens.g.dart by hand.
      - name: Generated tokens match the versioned outputs
        run: |
          npm run build
          git diff --exit-code -- ../web/src/styles/tokens.css ../movil/lib/design_system/tokens.g.dart \
            || { echo "::error::Token drift: run «cd design && npm run build» and commit the outputs"; exit 1; }

  contract:
    name: contract
    needs: changes
    if: needs.changes.outputs.contract == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Lint OpenAPI contracts
        run: npx --yes @redocly/cli@2 lint
