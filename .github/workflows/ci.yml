# CI per piece. Protected branches require the jobs «ci», «api», «web», «movil» and «contract».
# Path filters run inside the workflow (job «changes») so that a job whose piece did not change
# ends as «skipped», which GitHub treats as passing for required checks.
name: ci
on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Methodology documents
        run: |
          for f in "AGENTS.md" "docs/architecture.md" ".specify/memory/constitution.md" "docs/deployment.md" "docs/glossary.md" "PRODUCT.md"; do
            test -f "$f" || { echo "Missing $f"; exit 1; }
          done

  changes:
    name: changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      api: ${{ steps.filter.outputs.api }}
      web: ${{ steps.filter.outputs.web }}
      movil: ${{ steps.filter.outputs.movil }}
      contract: ${{ steps.filter.outputs.contract }}
    steps:
      - uses: actions/checkout@v7
      - id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            shared: &shared
              - '.github/workflows/ci.yml'
            api:
              - *shared
              - 'api/**'
              - 'contracts/**'
            web:
              - *shared
              - 'web/**'
              - 'contracts/**'
            movil:
              - *shared
              - 'movil/**'
            contract:
              - *shared
              - 'contracts/**'
              - 'redocly.yaml'
              - '.redocly.lint-ignore.yaml'

  api:
    name: api
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      # Docker is available on ubuntu-latest; Testcontainers starts PostgreSQL with the «test» profile.
      - name: Build and test
        run: ./mvnw -B verify

  web:
    name: web
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Generated API types match the contract
        run: npm run api:check
      - run: npm run build
      - run: npm test -- --watch=false

  movil:
    name: movil
    needs: changes
    if: needs.changes.outputs.movil == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: movil
    steps:
      - uses: actions/checkout@v7
      # Pinned for reproducible analysis: 3.50 deprecates package:flutter/material.dart.
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.9'
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  contract:
    name: contract
    needs: changes
    if: needs.changes.outputs.contract == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Lint OpenAPI contracts
        run: npx --yes @redocly/cli@2 lint
