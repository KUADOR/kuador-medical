name: medical_kuador
description: "Medical Kuador mobile app."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.10.0

dependencies:
  app_links: ^7.0.0
  connectivity_plus: ^7.3.2
  flutter:
    sdk: flutter
  flutter_secure_storage: ^11.2.0
  flutter_svg: ^2.3.4
  http: ^1.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # Design system assets (ADR-006). Icons: the single SVG set from
  # design/icons/, drawn with flutter_svg. Fonts: self-hosted, never from a CDN.
  assets:
    - assets/icons/
    - assets/fonts/

  # Figtree (SIL OFL 1.1, assets/fonts/OFL.txt): base family of the identity guide (DESIGN.md),
  # same name as the type.family.base token.
  fonts:
    - family: Figtree
      fonts:
        - asset: assets/fonts/Figtree-Regular.ttf
          weight: 400
        - asset: assets/fonts/Figtree-Medium.ttf
          weight: 500
        - asset: assets/fonts/Figtree-SemiBold.ttf
          weight: 600
