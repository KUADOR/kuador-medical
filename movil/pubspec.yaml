name: medical_kuador
description: "Medical Kuador mobile app."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.10.0

dependencies:
  app_links: ^7.0.0
  connectivity_plus: ^7.3.2
  flutter:
    sdk: flutter
  flutter_secure_storage: ^11.2.0
  flutter_svg: ^2.3.4
  http: ^1.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # Design system assets (ADR-006). Icons: the single SVG set from
  # design/icons/, drawn with flutter_svg. Fonts: self-hosted, never from a CDN.
  assets:
    - assets/icons/
    - assets/fonts/

  # The base family comes from the identity guide (MEDK-39). When it is chosen,
  # declare it here with the same name as the type.family.base token, e.g.:
  # fonts:
  #   - family: <type.family.base>
  #     fonts:
  #       - asset: assets/fonts/<Family>-Regular.ttf
  #       - asset: assets/fonts/<Family>-SemiBold.ttf
  #         weight: 600
