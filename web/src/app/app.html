@if (bareLayout()) {
  <router-outlet />
} @else {
  <kd-shell brand="Medical Kuador">
    <div kdShellNav class="app-nav">
      @if (isAuthenticated()) {
        <div class="app-nav__context">
          @if (accountLabel(); as label) {
            <p class="app-nav__account" data-testid="account-name">{{ label }}</p>
          }
          <mk-branch-switcher />
        </div>
      }
      <kd-nav label="Navegación principal" [items]="navItems()" />
    </div>

    <div kdShellAccount class="app-account">
      @if (isAuthenticated()) {
        <button
          kdButton
          variant="tertiary"
          icon="log-out"
          type="button"
          data-testid="logout"
          (click)="logout()"
        >
          Salir
        </button>
      } @else {
        <a kdButton variant="tertiary" icon="log-in" [routerLink]="links.login">Ingresar</a>
        <a kdButton variant="tertiary" [routerLink]="links.signup">Registrar clínica</a>
      }
    </div>

    <mk-subscription-banner />
    <router-outlet />
  </kd-shell>
}
