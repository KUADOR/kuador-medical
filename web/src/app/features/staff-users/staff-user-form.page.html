<kd-page
  heading="Invitar persona"
  headingId="staff-form-title"
  description="Registra sus datos y sus roles. Le enviaremos por correo un enlace de un solo uso para que active su cuenta."
>
  <a kdPageBefore kdButton variant="tertiary" icon="arrow-left" [routerLink]="staffLink"
    >Volver al personal</a
  >

  @switch (state().kind) {
    @case ('loading') {
      <kd-loading-state label="Cargando roles…" />
    }
    @case ('failed') {
      <kd-alert tone="error" data-testid="load-error">{{ loadFailure() }}</kd-alert>
      <kd-actions>
        <button kdButton type="button" icon="refresh-cw" (click)="load()">Volver a intentar</button>
      </kd-actions>
    }
    @default {
      <form class="staff-form" [formGroup]="form" (ngSubmit)="submit()" novalidate>
        @if (failure(); as message) {
          <kd-alert tone="error" data-testid="form-error" tabindex="-1">{{ message }}</kd-alert>
        }

        <kd-field label="Nombres">
          <input
            kdInput
            id="staff-first-names"
            type="text"
            formControlName="firstNames"
            autocomplete="off"
            [attr.maxlength]="limits.name"
          />
        </kd-field>

        <kd-field label="Apellidos">
          <input
            kdInput
            id="staff-last-names"
            type="text"
            formControlName="lastNames"
            autocomplete="off"
            [attr.maxlength]="limits.name"
          />
        </kd-field>

        <kd-field label="Correo" hint="Recibirá aquí la invitación. No se puede cambiar después.">
          <input
            kdInput
            id="staff-email"
            type="email"
            formControlName="email"
            autocomplete="off"
            [attr.maxlength]="limits.email"
          />
        </kd-field>

        <kd-field label="Puesto de trabajo">
          <input
            kdInput
            id="staff-job-title"
            type="text"
            formControlName="jobTitle"
            autocomplete="off"
            [attr.maxlength]="limits.jobTitle"
          />
        </kd-field>

        <kd-field
          [label]="'Registro profesional' + (registrationRequired() ? '' : ' (opcional)')"
          [hint]="
            registrationRequired()
              ? 'Obligatorio: elegiste un rol clínico.'
              : 'Obligatorio solo para roles clínicos.'
          "
        >
          <input
            kdInput
            id="staff-registration"
            type="text"
            formControlName="professionalRegistration"
            autocomplete="off"
            [attr.maxlength]="limits.professionalRegistration"
            [attr.aria-required]="registrationRequired() ? 'true' : null"
          />
        </kd-field>

        <mk-role-assignments-editor
          idPrefix="staff-assignments"
          [draft]="draft()"
          (draftChange)="changeDraft($event)"
          [roles]="roles()"
          [branches]="branches()"
          [callerIsOwner]="callerIsOwner()"
          [error]="assignmentError()"
        />

        <kd-actions>
          <button
            kdButton
            variant="primary"
            icon="mail"
            type="submit"
            [disabled]="submitting()"
            [attr.aria-busy]="submitting() ? 'true' : null"
          >
            {{ submitting() ? 'Enviando invitación…' : 'Registrar y enviar invitación' }}
          </button>
          <a kdButton variant="tertiary" [routerLink]="staffLink">Cancelar</a>
        </kd-actions>
      </form>
    }
  }
</kd-page>
