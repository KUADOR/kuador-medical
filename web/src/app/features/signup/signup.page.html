<kd-page
  heading="Registrar clínica"
  headingId="signup-title"
  width="narrow"
  description="Crea la cuenta de tu clínica. Quien la registra queda como OWNER y ADMIN y puede administrar sus roles."
>
  <form class="account-form" [formGroup]="form" (ngSubmit)="submit()" novalidate>
    @if (failure(); as message) {
      <kd-alert tone="error" data-testid="form-error">{{ message }}</kd-alert>
    }

    <kd-field label="Nombre de la clínica">
      <input
        kdInput
        id="signup-clinic"
        type="text"
        formControlName="clinicName"
        autocomplete="organization"
        maxlength="120"
      />
    </kd-field>

    <kd-field label="Tu nombre">
      <input
        kdInput
        id="signup-name"
        type="text"
        formControlName="ownerDisplayName"
        autocomplete="name"
        maxlength="120"
      />
    </kd-field>

    <kd-field label="Correo">
      <input
        kdInput
        id="signup-email"
        type="email"
        formControlName="email"
        autocomplete="email"
        inputmode="email"
      />
    </kd-field>

    <kd-field label="Contraseña" [hint]="'Al menos ' + passwordMinLength + ' caracteres.'">
      <input
        kdInput
        id="signup-password"
        type="password"
        formControlName="password"
        autocomplete="new-password"
      />
    </kd-field>

    <kd-field label="Repite la contraseña">
      <input
        kdInput
        id="signup-confirm"
        type="password"
        formControlName="confirmPassword"
        autocomplete="new-password"
      />
    </kd-field>

    <kd-actions>
      <button kdButton variant="primary" type="submit" [disabled]="submitting()">
        {{ submitting() ? 'Registrando…' : 'Registrar clínica' }}
      </button>
    </kd-actions>
  </form>

  <p class="account-note">
    ¿Ya tienes cuenta?
    <a kdButton variant="tertiary" [routerLink]="loginLink">Ingresar</a>
  </p>
</kd-page>
