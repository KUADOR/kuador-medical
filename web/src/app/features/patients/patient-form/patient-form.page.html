<kd-page [heading]="heading()" headingId="patient-form-title" width="narrow">
  <a kdPageBefore kdButton variant="tertiary" icon="arrow-left" [routerLink]="cancelLink()"
    >Volver</a
  >

  @switch (state().kind) {
    @case ('loading') {
      <kd-loading-state label="Cargando…" />
    }
    @case ('failed') {
      <kd-alert tone="error" data-testid="load-error">{{ loadFailure()?.message }}</kd-alert>
      @if (!loadFailure()?.notFound) {
        <kd-actions>
          <button kdButton type="button" icon="refresh-cw" (click)="load()">Volver a intentar</button>
        </kd-actions>
      }
    }
    @default {
      <form class="patient-form__form" [formGroup]="form" (ngSubmit)="submit()" novalidate>
        @if (failure(); as message) {
          <kd-alert tone="error" data-testid="form-error" tabindex="-1">
            <p class="patient-form__message">{{ message }}</p>
            @if (versionConflict()) {
              <kd-actions>
                <button kdButton type="button" icon="refresh-cw" (click)="load()">
                  Recargar los datos
                </button>
              </kd-actions>
            }
          </kd-alert>
        }

        <fieldset kdFieldGroup [boxed]="true" legend="Datos del paciente">
          <kd-field label="Tipo de documento" [error]="error('documentType')">
            <select kdInput id="patient-documentType" formControlName="documentType">
              @for (option of documentTypes; track option.code) {
                <option [value]="option.code">{{ option.label }}</option>
              }
            </select>
          </kd-field>

          <kd-field label="Número de documento" [error]="error('documentNumber')">
            <input
              kdInput
              id="patient-documentNumber"
              type="text"
              formControlName="documentNumber"
              autocomplete="off"
            />
          </kd-field>

          <kd-field label="Nombres" [error]="error('firstNames')">
            <input
              kdInput
              id="patient-firstNames"
              type="text"
              formControlName="firstNames"
              autocomplete="off"
            />
          </kd-field>

          <kd-field label="Apellidos" [error]="error('lastNames')">
            <input
              kdInput
              id="patient-lastNames"
              type="text"
              formControlName="lastNames"
              autocomplete="off"
            />
          </kd-field>

          <kd-field
            label="Fecha de nacimiento"
            [hint]="
              'Si es menor de ' + majorityAge + ' años se pedirán los datos de su representante.'
            "
            [error]="error('birthDate')"
          >
            <input kdInput id="patient-birthDate" type="date" formControlName="birthDate" />
          </kd-field>

          <kd-field label="Sexo" [error]="error('sex')">
            <select kdInput id="patient-sex" formControlName="sex">
              <option value="" disabled>Elige una opción</option>
              @for (option of sexOptions; track option.code) {
                <option [value]="option.code">{{ option.label }}</option>
              }
            </select>
          </kd-field>

          <kd-field label="Correo (opcional)" [error]="error('email')">
            <input
              kdInput
              id="patient-email"
              type="email"
              formControlName="email"
              autocomplete="off"
              inputmode="email"
            />
          </kd-field>

          <kd-field
            label="Teléfono (opcional)"
            hint="Con el signo + y el código de país, sin espacios."
            [error]="error('phone')"
          >
            <input kdInput id="patient-phone" type="tel" formControlName="phone" autocomplete="off" />
          </kd-field>

          <kd-field label="Dirección (opcional)" [error]="error('address')">
            <input
              kdInput
              id="patient-address"
              type="text"
              formControlName="address"
              autocomplete="off"
            />
          </kd-field>
        </fieldset>

        @if (isNew()) {
          @if (minor()) {
            <fieldset
              kdFieldGroup
              [boxed]="true"
              legend="Representante legal (obligatorio para menores de edad)"
              hint="El paciente es menor de edad: no tendrá cuenta propia y su representante da el consentimiento."
              data-testid="guardian-section"
              formGroupName="guardian"
            >
              <kd-field label="Parentesco o relación" [error]="relationshipError()">
                <input
                  kdInput
                  id="guardian-relationship"
                  type="text"
                  formControlName="relationship"
                  autocomplete="off"
                />
              </kd-field>
              <mk-guardian-person-fields
                [group]="form.controls.guardian.controls.person"
                idPrefix="guardian"
              />
            </fieldset>
          }

          <fieldset kdFieldGroup [boxed]="true" legend="Consentimiento de datos personales">
            @if (!minor()) {
              <kd-field label="¿Quién otorga el consentimiento?">
                <select kdInput id="patient-consentGrantedBy" formControlName="consentGrantedBy">
                  <option value="PATIENT">El paciente</option>
                  <option value="GUARDIAN">Su representante</option>
                </select>
              </kd-field>
            }
            <kd-field
              [label]="
                minor()
                  ? 'El representante acepta el tratamiento de los datos personales del paciente por parte de la clínica.'
                  : 'Se acepta el tratamiento de los datos personales del paciente por parte de la clínica.'
              "
              [hint]="'Versión del texto: ' + consentVersion + '.'"
              [error]="error('consent')"
            >
              <input kdInput id="patient-consent" type="checkbox" formControlName="consent" />
            </kd-field>
          </fieldset>
        }

        <kd-actions>
          <button kdButton variant="primary" icon="check" type="submit" [disabled]="submitting()">
            @if (submitting()) {
              Guardando…
            } @else {
              {{ isNew() ? 'Registrar paciente' : 'Guardar cambios' }}
            }
          </button>
          <a kdButton variant="tertiary" [routerLink]="cancelLink()">Cancelar</a>
        </kd-actions>
      </form>
    }
  }
</kd-page>
