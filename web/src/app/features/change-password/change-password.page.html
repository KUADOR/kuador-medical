<kd-page heading="Cambiar contraseña" headingId="change-password-title" width="narrow">
  <kd-alert tone="info" data-testid="required-notice">
    @if (account(); as current) {
      {{ current.displayName }}, antes
    } @else {
      Antes
    }
    de continuar debes reemplazar tu contraseña inicial por una nueva. Hasta hacerlo no puedes usar
    el resto del sistema.
  </kd-alert>

  <form class="account-form" [formGroup]="form" (ngSubmit)="submit()" novalidate>
    @if (failure(); as message) {
      <kd-alert tone="error" data-testid="form-error">{{ message }}</kd-alert>
    }

    <kd-field label="Contraseña actual">
      <input
        kdInput
        id="current-password"
        type="password"
        formControlName="currentPassword"
        autocomplete="current-password"
      />
    </kd-field>

    <kd-field
      label="Contraseña nueva"
      [hint]="'Al menos ' + passwordMinLength + ' caracteres y distinta de la actual.'"
    >
      <input
        kdInput
        id="new-password"
        type="password"
        formControlName="newPassword"
        autocomplete="new-password"
      />
    </kd-field>

    <kd-field label="Repite la contraseña nueva">
      <input
        kdInput
        id="confirm-password"
        type="password"
        formControlName="confirmPassword"
        autocomplete="new-password"
      />
    </kd-field>

    <kd-actions>
      <button kdButton variant="primary" type="submit" [disabled]="submitting()">
        {{ submitting() ? 'Guardando…' : 'Guardar contraseña' }}
      </button>
      <button kdButton variant="tertiary" type="button" icon="log-out" (click)="logout()">
        Salir
      </button>
    </kd-actions>
  </form>
</kd-page>
