<kd-page
  heading="Registrarme como paciente"
  headingId="sr-title"
  width="narrow"
  [description]="
    state() === 'form' ? 'Completa tus datos para crear tu cuenta de paciente en la clínica.' : null
  "
>
  @switch (state()) {
    @case ('done') {
      <kd-alert tone="ok" data-testid="notice">{{ doneMessage }}</kd-alert>
    }
    @case ('unavailable') {
      <kd-alert tone="error" data-testid="unavailable">{{ unavailableMessage }}</kd-alert>
    }
    @default {
      <form class="sr-form" [formGroup]="form" (ngSubmit)="submit()" novalidate>
        @if (failure(); as message) {
          <kd-alert tone="error" data-testid="form-error">{{ message }}</kd-alert>
        }

        <kd-field label="Tipo de documento" [error]="error('documentType')">
          <select kdInput id="sr-documentType" formControlName="documentType">
            @for (option of documentTypes; track option.code) {
              <option [value]="option.code">{{ option.label }}</option>
            }
          </select>
        </kd-field>

        <kd-field label="Número de documento" [error]="error('documentNumber')">
          <input
            kdInput
            id="sr-documentNumber"
            type="text"
            formControlName="documentNumber"
            autocomplete="off"
          />
        </kd-field>

        <kd-field label="Nombres" [error]="error('firstNames')">
          <input
            kdInput
            id="sr-firstNames"
            type="text"
            formControlName="firstNames"
            autocomplete="given-name"
          />
        </kd-field>

        <kd-field label="Apellidos" [error]="error('lastNames')">
          <input
            kdInput
            id="sr-lastNames"
            type="text"
            formControlName="lastNames"
            autocomplete="family-name"
          />
        </kd-field>

        <kd-field
          label="Fecha de nacimiento"
          hint="Solo las personas mayores de edad pueden registrarse por su cuenta."
          [error]="error('birthDate')"
        >
          <input
            kdInput
            id="sr-birthDate"
            type="date"
            formControlName="birthDate"
            autocomplete="bday"
          />
        </kd-field>

        <kd-field label="Sexo" [error]="error('sex')">
          <select kdInput id="sr-sex" formControlName="sex">
            <option value="" disabled>Elige una opción</option>
            @for (option of sexOptions; track option.code) {
              <option [value]="option.code">{{ option.label }}</option>
            }
          </select>
        </kd-field>

        <kd-field
          label="Correo"
          hint="Te enviaremos un enlace para verificarlo."
          [error]="error('email')"
        >
          <input
            kdInput
            id="sr-email"
            type="email"
            formControlName="email"
            autocomplete="email"
            inputmode="email"
          />
        </kd-field>

        <kd-field
          label="Teléfono (opcional)"
          hint="Con el signo + y el código de país, sin espacios."
          [error]="error('phone')"
        >
          <input kdInput id="sr-phone" type="tel" formControlName="phone" autocomplete="tel" />
        </kd-field>

        <kd-field label="Dirección (opcional)" [error]="error('address')">
          <input
            kdInput
            id="sr-address"
            type="text"
            formControlName="address"
            autocomplete="street-address"
          />
        </kd-field>

        <kd-field
          label="Contraseña"
          [hint]="'Al menos ' + passwordMinLength + ' caracteres.'"
          [error]="error('password')"
        >
          <input
            kdInput
            id="sr-password"
            type="password"
            formControlName="password"
            autocomplete="new-password"
          />
        </kd-field>

        <kd-field label="Repite la contraseña" [error]="error('confirmPassword')">
          <input
            kdInput
            id="sr-confirmPassword"
            type="password"
            formControlName="confirmPassword"
            autocomplete="new-password"
          />
        </kd-field>

        <kd-field
          label="Acepto el tratamiento de mis datos personales por parte de la clínica."
          [hint]="'Versión del texto: ' + consentVersion + '.'"
          [error]="error('consent')"
        >
          <input kdInput id="sr-consent" type="checkbox" formControlName="consent" />
        </kd-field>

        <kd-actions>
          <button kdButton variant="primary" type="submit" [disabled]="submitting()">
            {{ submitting() ? 'Enviando…' : 'Registrarme' }}
          </button>
        </kd-actions>
      </form>
    }
  }

  <p class="sr-login">¿Ya tienes cuenta? <a [routerLink]="loginLink">Ingresar</a></p>
</kd-page>
