<section class="auth-panel" aria-labelledby="login-title">
  <h1 id="login-title" class="auth-panel__title">Ingresar</h1>
  <p class="auth-panel__lead">Ingresa con el correo y la contraseña de tu cuenta.</p>

  @if (notice) {
    <kd-alert tone="ok" data-testid="notice">{{ notice }}</kd-alert>
  }

  <form class="auth-panel__form" [formGroup]="form" (ngSubmit)="submit()" novalidate>
    @if (failure(); as message) {
      <kd-alert tone="error" data-testid="form-error">{{ message }}</kd-alert>
    }

    <kd-field label="Correo">
      <input
        kdInput
        id="login-email"
        type="email"
        formControlName="email"
        autocomplete="username"
        inputmode="email"
      />
    </kd-field>

    <kd-field label="Contraseña">
      <input
        kdInput
        id="login-password"
        type="password"
        formControlName="password"
        autocomplete="current-password"
      />
    </kd-field>

    <button
      kdButton
      variant="primary"
      icon="log-in"
      type="submit"
      class="auth-panel__submit"
      [disabled]="submitting()"
      [attr.aria-busy]="submitting() ? 'true' : null"
    >
      {{ submitting() ? 'Ingresando…' : 'Ingresar' }}
    </button>
  </form>

  <div class="auth-panel__links">
    <a kdButton variant="tertiary" [routerLink]="forgotPasswordLink">¿Olvidaste tu contraseña?</a>
    <p class="auth-panel__note">
      ¿Tu clínica todavía no tiene cuenta?
      <a kdButton variant="tertiary" [routerLink]="signupLink">Registrar clínica</a>
    </p>
  </div>
</section>
