<kd-page
  heading="Crear contraseña nueva"
  headingId="reset-title"
  width="narrow"
  [description]="invalidLink() ? null : 'El enlace vale una sola vez y por poco tiempo.'"
>
  @if (invalidLink()) {
    <kd-alert tone="error" data-testid="link-error">{{ invalidLinkMessage }}</kd-alert>
    <kd-actions>
      <a kdButton variant="primary" [routerLink]="forgotPasswordLink">Pedir un enlace nuevo</a>
    </kd-actions>
  } @else {
    <form class="account-form" [formGroup]="form" (ngSubmit)="submit()" novalidate>
      @if (failure(); as message) {
        <kd-alert tone="error" data-testid="form-error">{{ message }}</kd-alert>
      }

      <kd-field
        label="Contraseña nueva"
        [hint]="'Al menos ' + passwordMinLength + ' caracteres.'"
      >
        <input
          kdInput
          id="new-password"
          type="password"
          formControlName="newPassword"
          autocomplete="new-password"
        />
      </kd-field>

      <kd-field label="Repite la contraseña nueva">
        <input
          kdInput
          id="confirm-password"
          type="password"
          formControlName="confirmPassword"
          autocomplete="new-password"
        />
      </kd-field>

      <kd-actions>
        <button kdButton variant="primary" type="submit" [disabled]="submitting()">
          {{ submitting() ? 'Guardando…' : 'Guardar contraseña' }}
        </button>
      </kd-actions>
    </form>
  }

  <kd-actions>
    <a kdButton variant="tertiary" [routerLink]="loginLink">Volver a ingresar</a>
  </kd-actions>
</kd-page>
