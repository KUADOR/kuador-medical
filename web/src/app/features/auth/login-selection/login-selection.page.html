<section class="auth-panel" aria-labelledby="selection-title">
  <h1 id="selection-title" class="auth-panel__title">{{ heading() }}</h1>
  <p class="auth-panel__lead">{{ hint() }}</p>

  @if (failure(); as message) {
    <kd-alert tone="error" tabindex="-1" data-testid="form-error">{{ message }}</kd-alert>
  }

  <ul class="auth-panel__choices" [attr.aria-label]="isClinic() ? 'Clínicas' : 'Sucursales'">
    @for (option of options(); track option.id) {
      <li>
        <button
          kdButton
          type="button"
          class="auth-panel__choice"
          data-testid="choice"
          [icon]="isClinic() ? 'building-2' : 'map-pin'"
          [disabled]="submitting() !== null"
          [attr.aria-busy]="submitting() === option.id ? 'true' : null"
          (click)="choose(option.id)"
        >
          {{ option.name }}
        </button>
      </li>
    }
  </ul>

  <div class="auth-panel__links">
    <a kdButton variant="tertiary" icon="arrow-left" [routerLink]="loginLink" (click)="cancel()"
      >Ingresar con otra cuenta</a
    >
  </div>
</section>
