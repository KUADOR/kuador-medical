server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Compress text assets (MEDK-48, SC-010): the initial JS goes from ~560 kB to ~150 kB on
    # the wire, which keeps the LCP of /login under 2.5 s on the Lighthouse mobile profile.
    # text/html is always compressed once gzip is on. Compressed also behind a proxy or CDN
    # (gzip_proxied any); api responses are never compressed here (see location /api/).
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Same-origin proxy to the api container.
    location /api/ {
        # Responses carry tokens and personal data: no compression (BREACH-style leaks).
        gzip off;
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Signed download links of data exports (MEDK-70): the grant in the query string is a bearer
    # credential for 5 minutes, so these requests stay out of the access log. Each download is
    # audited by the api.
    location ^~ /api/v1/public/tenant-exports/ {
        gzip off;
        access_log off;
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Runtime config must never be cached.
    location = /config.json {
        add_header Cache-Control "no-store";
    }

    # App Links / Universal Links association files (ADR-014): JSON, never the SPA fallback,
    # never redirected. apple-app-site-association has no extension, so its type is set here.
    location ^~ /.well-known/ {
        default_type application/json;
        add_header Cache-Control "max-age=3600";
        try_files $uri =404;
    }

    # Self-hosted fonts and other files referenced from the styles (ADR-007): the build copies
    # them with a content hash in the name, so they can be cached for a year. Never the SPA fallback.
    location ^~ /media/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Angular client-side routing.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
