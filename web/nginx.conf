server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Same-origin proxy to the api container.
    location /api/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Runtime config must never be cached.
    location = /config.json {
        add_header Cache-Control "no-store";
    }

    # App Links / Universal Links association files (ADR-014): JSON, never the SPA fallback,
    # never redirected. apple-app-site-association has no extension, so its type is set here.
    location ^~ /.well-known/ {
        default_type application/json;
        add_header Cache-Control "max-age=3600";
        try_files $uri =404;
    }

    # Angular client-side routing.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
