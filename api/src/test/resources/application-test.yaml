# Automated tests: PostgreSQL comes from Testcontainers (TestcontainersConfiguration), no .env needed.
spring:
  datasource:
    url: jdbc:postgresql://overridden-by-testcontainers/medical
    username: test
    password: test

kuador:
  cors:
    allowed-origins: http://localhost:4200
  jwt:
    # Random per test context: no signing key is ever stored in the repository.
    secret: ${random.uuid}${random.uuid}
  two-factor:
    # Random per test context, like the signing key.
    encryption-key: ${random.uuid}${random.uuid}
  bootstrap-admin:
    email: bootstrap-admin@example.test
    password: ${random.uuid}
  links:
    # Fictitious domain: tests only read the links from the captured emails.
    web-base-url: https://app.example.test
  mail:
    from: no-reply@example.test
  patients:
    adulthood:
      # Tests run the adulthood job explicitly (AdulthoodJob.runOnce).
      cron: "-"
  platform:
    subscription-lifecycle:
      # Tests run the lifecycle job explicitly (SubscriptionLifecycleJob.runOnce).
      cron: "-"
