# Automated tests: PostgreSQL comes from Testcontainers (TestcontainersConfiguration), no .env needed.
spring:
  datasource:
    url: jdbc:postgresql://overridden-by-testcontainers/medical
    username: test
    password: test

kuador:
  cors:
    allowed-origins: http://localhost:4200
  jwt:
    # Random per test context: no signing key is ever stored in the repository.
    secret: ${random.uuid}${random.uuid}
  links:
    web-base-url: http://localhost:4200
  mail:
    from: no-reply@medical.example.test
  bootstrap-admin:
    email: bootstrap-admin@example.test
    password: ${random.uuid}
