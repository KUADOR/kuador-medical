openapi: 3.1.0
info:
  title: Medical Kuador Platform and Subscriptions API
  version: 0.1.0
  summary: Plans, prices, clinics (tenants), subscriptions, owner onboarding, 2FA and data export (MEDK-49).
  description: |
    Contract-first definition (ADR-011) of the platform and subscriptions epic
    (MEDK-49, plan § Contrato de API): plans with modules, limits and versioned
    prices; platform settings; clinic (tenant) onboarding by the SUPER_ADMIN with an
    OWNER invitation; the subscription state machine with manual transitions,
    reactivation, plan changes and price lock; purge of cancelled clinics; the
    OWNER invitation, terms acceptance and mandatory TOTP second factor; and the
    clinic view of its subscription and data export.

    This contract is the **target**: it is implemented by MEDK-65 to MEDK-70 and
    consumed by the web through MEDK-72 to MEDK-75.

    Cross-cutting rules:

    - **Platform scope (ADR-015 to ADR-019, Constitution VII).** Every `/platform/**`
      operation requires a `PLATFORM` access token (SUPER_ADMIN) and a `platform.*`
      permission. A `TENANT` token responds `403` (`FORBIDDEN`). Platform
      permissions can never be assigned to a clinic role.
    - **Tenant as a managed resource.** `/platform/tenants/{tenantId}/**` is the only
      place where a clinic identifier travels in a request: the SUPER_ADMIN manages
      clinics as resources and never reads their clinical data. Clinic operations
      (`/tenant/**`, `/auth/**`, `/public/**`) never accept a tenant identifier; the
      clinic is resolved from the access token (ADR-007).
    - **Explicit permission, denied by default (ADR-008).** Every operation states
      its required permission in `x-required-permission` (`public`, `authenticated`
      or a permission code). Public operations are also marked `x-public: true` and
      have no security requirement.
    - **One-time tokens (ADR-014).** The OWNER invitation token travels only in
      request bodies, never in paths or query strings. Plan § Contrato listed
      `GET /api/public/owner-invitations/{token}`; it is published as
      `POST /public/owner-invitations/preview` to keep ADR-014.
    - **Mandatory second factor for OWNER (ADR-019).** Until an OWNER session has
      passed the TOTP second factor, every operation other than the
      `/auth/two-factor/**` operations, `POST /auth/logout` and the public ones
      responds `401` (`TWO_FACTOR_REQUIRED`) with `twoFactor` telling the client
      whether to enroll or to verify.
    - **Access mode by subscription status (ADR-017).** `TRIAL`, `ACTIVE` and
      `PAST_DUE` allow full access within the plan; `SUSPENDED` and `CANCELLED`
      (during retention) allow only reads and data export: any other write on a
      clinic operation, in any contract, responds `403` (`TENANT_READ_ONLY`). A
      module not enabled by the plan responds `403` (`MODULE_NOT_IN_PLAN`). Creating
      a resource beyond a plan limit responds `409` (`PLAN_LIMIT_REACHED`).
    - **Money.** Amounts are decimal strings with two decimals (`"49.00"`) in the
      ISO 4217 `currency` of the price (USD), always **without VAT**; VAT is shown on
      the invoice, outside this epic.
    - **Dates.** Instants are UTC (`date-time`); day counts use the
      `America/Guayaquil` time zone.
    - **Optimistic locking.** Plan, settings and subscription changes send the
      `version` they read; a stale one responds `409` (`VERSION_CONFLICT`).
    - **Idempotent creations.** Creation requests (`201`) accept an
      `Idempotency-Key` header and an optional client-generated `id` (UUID).
    - **Errors** use Problem Details (RFC 9457) with a stable `code`; clients
      translate the `code` into a user-facing message in Spanish.
    - **Examples** use fictitious data only.

    Error codes of the plan and their published name:

    | Plan | Contract | Status |
    |---|---|---|
    | `TENANT_READ_ONLY` | `TENANT_READ_ONLY` | 403 |
    | `PLAN_LIMIT_EXCEEDED` | `PLAN_LIMIT_REACHED` (already published by `user-registration.openapi.yaml`) | 409 |
    | `MODULE_NOT_IN_PLAN` | `MODULE_NOT_IN_PLAN` | 403 |
    | `INVALID_SUBSCRIPTION_TRANSITION` | `INVALID_SUBSCRIPTION_TRANSITION` | 409 |
    | `REACTIVATION_WINDOW_CLOSED` | `REACTIVATION_WINDOW_CLOSED` | 409 |
    | `INVITATION_INVALID_OR_EXPIRED` | `INVITATION_INVALID_OR_EXPIRED` | 410 |
    | `LAST_OWNER_PROTECTED` | `LAST_OWNER` (already published by `user-registration.openapi.yaml`) | 409 |
    | `TWO_FACTOR_REQUIRED` | `TWO_FACTOR_REQUIRED` | 401 |
    | `RUC_ALREADY_REGISTERED` | `RUC_ALREADY_REGISTERED` | 409 |

    Permissions introduced by this contract (added to the `Permission` catalog by
    MEDK-65, following the dotted naming of ADR-003):

    | Plan | Code | Scope |
    |---|---|---|
    | `PLATFORM_PLAN_MANAGE` | `platform.plans.manage` | Platform |
    | `PLATFORM_TENANT_MANAGE` | `platform.tenants.manage` (includes manual transitions and reactivation) | Platform |
    | `PLATFORM_TENANT_PURGE` | `platform.tenants.purge` | Platform |
    | `PLATFORM_SETTINGS_MANAGE` | `platform.settings.manage` | Platform |
    | `SUBSCRIPTION_VIEW` | `subscription.read` (suggested for OWNER) | Clinic |
    | `TENANT_DATA_EXPORT` | `tenant.data.export` (suggested for OWNER) | Clinic |

    Platform permissions are never assignable to a clinic role.
  license:
    name: Proprietary
    identifier: LicenseRef-Kuador-Proprietary
servers:
  - url: /api/v1
    description: Same origin as the client (local, staging and production).
tags:
  - name: Plans
    description: Plans, their modules, limits and versioned prices (SUPER_ADMIN).
  - name: Catalog
    description: Fixed catalogs of modules and limits (SUPER_ADMIN).
  - name: Settings
    description: Platform settings such as trial, grace and retention periods (SUPER_ADMIN).
  - name: Tenants
    description: Clinic (tenant) onboarding and administration (SUPER_ADMIN).
  - name: Subscriptions
    description: Subscription state, transitions, plan changes and price lock (SUPER_ADMIN).
  - name: Purge
    description: Definitive deletion of cancelled clinics with double confirmation (SUPER_ADMIN).
  - name: Owner onboarding
    description: Public OWNER invitation, password and terms acceptance.
  - name: Two-factor
    description: TOTP second factor enrollment and verification.
  - name: Clinic subscription
    description: The clinic's own view of its subscription and its data export.
security:
  - bearerAuth: []
paths:
  # ------------------------------------------------------------------ Plans
  /platform/plans:
    get:
      tags: [Plans]
      operationId: listPlans
      summary: List plans
      description: Returns every plan with its modules, limits and current prices. Archived plans are included unless `status` filters them out.
      x-required-permission: platform.plans.manage
      parameters:
        - name: status
          in: query
          required: false
          description: Filter by plan status.
          schema:
            $ref: '#/components/schemas/PlanStatus'
      responses:
        '200':
          description: Plans.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Plan'
              examples:
                plans:
                  value:
                    - id: 3f2e1d0c-9b8a-4c7d-8e6f-5a4b3c2d1e0f
                      code: STANDARD
                      name: Standard
                      description: Medical clinic with up to three branches.
                      trial: false
                      status: ACTIVE
                      modules: [AGENDA, PATIENTS, CLINICAL_RECORDS, CONSULTATION, USERS, NOTIFICATIONS]
                      limits:
                        MAX_BRANCHES: 3
                        MAX_USERS: 15
                        MAX_PATIENTS: 5000
                        MAX_APPOINTMENTS: null
                        MAX_STORAGE_MB: 10240
                      currentPrices:
                        - id: 1b2c3d4e-5f6a-4b7c-9d8e-0f1a2b3c4d5e
                          billingPeriod: MONTHLY
                          currency: USD
                          amount: '49.00'
                          effectiveFrom: '2030-01-01T05:00:00Z'
                          createdAt: '2029-12-20T15:00:00Z'
                      createdAt: '2029-12-20T15:00:00Z'
                      updatedAt: '2030-01-10T15:00:00Z'
                      version: 3
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [Plans]
      operationId: createPlan
      summary: Create a plan
      description: |
        Creates a plan with its enabled modules, limits (null means unlimited) and its
        initial prices, one per billing period. Only one plan can be the trial plan
        (`trial = true`); `code` is unique. Audited.
      x-required-permission: platform.plans.manage
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePlanRequest'
            examples:
              standard:
                value:
                  code: STANDARD
                  name: Standard
                  description: Medical clinic with up to three branches.
                  trial: false
                  modules: [AGENDA, PATIENTS, CLINICAL_RECORDS, CONSULTATION, USERS, NOTIFICATIONS]
                  limits:
                    MAX_BRANCHES: 3
                    MAX_USERS: 15
                    MAX_PATIENTS: 5000
                    MAX_APPOINTMENTS: null
                    MAX_STORAGE_MB: 10240
                  prices:
                    - billingPeriod: MONTHLY
                      currency: USD
                      amount: '49.00'
                    - billingPeriod: ANNUAL
                      currency: USD
                      amount: '490.00'
      responses:
        '201':
          description: Plan created.
          headers:
            Location:
              $ref: '#/components/headers/Location'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Plan'
              examples:
                created:
                  $ref: '#/components/examples/StandardPlan'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: |
            The `code` is already used, another trial plan exists (`VALIDATION` with
            field errors `DUPLICATE`), the idempotency key was reused with another body
            (`IDEMPOTENCY_KEY_REUSED`) or the client id is taken (`RESOURCE_ID_TAKEN`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                keyReused:
                  value:
                    type: about:blank
                    title: Conflict
                    status: 409
                    code: IDEMPOTENCY_KEY_REUSED
        '500':
          $ref: '#/components/responses/InternalError'

  /platform/plans/{planId}:
    parameters:
      - $ref: '#/components/parameters/PlanId'
    get:
      tags: [Plans]
      operationId: getPlan
      summary: Get a plan
      description: Returns the plan with its modules, limits and current prices.
      x-required-permission: platform.plans.manage
      responses:
        '200':
          description: The plan.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Plan'
              examples:
                standard:
                  $ref: '#/components/examples/StandardPlan'
                trial:
                  $ref: '#/components/examples/TrialPlan'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    put:
      tags: [Plans]
      operationId: updatePlan
      summary: Update a plan
      description: |
        Replaces the name, description, modules and limits of a plan. Prices are not
        changed here (see `POST /platform/plans/{planId}/prices`). Lowering a limit or
        removing a module never deletes clinic data: clinics over the new limit cannot
        create new resources of that kind until they comply. Archived plans cannot be
        edited (`PLAN_ARCHIVED`). Audited.
      x-required-permission: platform.plans.manage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePlanRequest'
            examples:
              update:
                value:
                  name: Standard
                  description: Medical clinic with up to three branches.
                  modules: [AGENDA, PATIENTS, CLINICAL_RECORDS, CONSULTATION, USERS, NOTIFICATIONS]
                  limits:
                    MAX_BRANCHES: 3
                    MAX_USERS: 20
                    MAX_PATIENTS: 5000
                    MAX_APPOINTMENTS: null
                    MAX_STORAGE_MB: 10240
                  version: 3
      responses:
        '200':
          description: Plan updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Plan'
              examples:
                updated:
                  $ref: '#/components/examples/StandardPlan'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/PlanConflict'
        '500':
          $ref: '#/components/responses/InternalError'

  /platform/plans/{planId}/archive:
    parameters:
      - $ref: '#/components/parameters/PlanId'
    post:
      tags: [Plans]
      operationId: archivePlan
      summary: Archive a plan
      description: |
        Archives a plan: it can no longer be chosen for new clinics or plan changes,
        and existing subscriptions keep it. Plans are never deleted. Archiving an
        archived plan is a no-op. The trial plan cannot be archived: it responds
        `400` (`VALIDATION`, field `trial`, code `TRIAL_PLAN_REQUIRED`). Audited.
      x-required-permission: platform.plans.manage
      responses:
        '200':
          description: Plan archived.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Plan'
              examples:
                archived:
                  $ref: '#/components/examples/ArchivedPlan'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /platform/plans/{planId}/prices:
    parameters:
      - $ref: '#/components/parameters/PlanId'
    get:
      tags: [Plans]
      operationId: listPlanPrices
      summary: List the price history of a plan
      description: Returns every price version of the plan, newest first. Prices are immutable.
      x-required-permission: platform.plans.manage
      parameters:
        - name: billingPeriod
          in: query
          required: false
          description: Filter by billing period.
          schema:
            $ref: '#/components/schemas/BillingPeriod'
      responses:
        '200':
          description: Price versions.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PlanPrice'
              examples:
                history:
                  value:
                    - id: 0a1b2c3d-4e5f-4a6b-8c7d-9e0f1a2b3c4d
                      billingPeriod: MONTHLY
                      currency: USD
                      amount: '55.00'
                      effectiveFrom: '2030-03-01T05:00:00Z'
                      createdAt: '2030-01-15T15:00:00Z'
                    - id: 1b2c3d4e-5f6a-4b7c-9d8e-0f1a2b3c4d5e
                      billingPeriod: MONTHLY
                      currency: USD
                      amount: '49.00'
                      effectiveFrom: '2030-01-01T05:00:00Z'
                      createdAt: '2029-12-20T15:00:00Z'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [Plans]
      operationId: createPlanPrice
      summary: Publish a new price version
      description: |
        Adds a new immutable price version for one billing period (ADR-015). It applies
        immediately to new subscriptions from `effectiveFrom`. Current subscriptions
        keep their contracted price until the first renewal at least
        `priceChangeNoticeDays` (30 by default) after the OWNER is notified by email
        (plan D1); clinics with a valid price lock keep it until the lock ends.
        `effectiveFrom` cannot be in the past. Audited.
      x-required-permission: platform.plans.manage
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePlanPriceRequest'
            examples:
              monthly:
                value:
                  billingPeriod: MONTHLY
                  currency: USD
                  amount: '55.00'
                  effectiveFrom: '2030-03-01T05:00:00Z'
      responses:
        '201':
          description: Price version created; affected clinics are notified.
          headers:
            Location:
              $ref: '#/components/headers/Location'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlanPrice'
              examples:
                created:
                  value:
                    id: 0a1b2c3d-4e5f-4a6b-8c7d-9e0f1a2b3c4d
                    billingPeriod: MONTHLY
                    currency: USD
                    amount: '55.00'
                    effectiveFrom: '2030-03-01T05:00:00Z'
                    createdAt: '2030-01-15T15:00:00Z'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/PlanConflict'
        '500':
          $ref: '#/components/responses/InternalError'

  # ------------------------------------------------------------------ Catalog
  /platform/catalog/modules:
    get:
      tags: [Catalog]
      operationId: listModuleCatalog
      summary: List the module catalog
      description: Returns the fixed catalog of modules a plan can enable, with a Spanish label for display.
      x-required-permission: platform.plans.manage
      responses:
        '200':
          description: Module catalog.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ModuleInfo'
              examples:
                modules:
                  value:
                    - code: AGENDA
                      label: Agenda y citas
                    - code: ODONTOGRAM
                      label: Odontograma
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'

  /platform/catalog/limits:
    get:
      tags: [Catalog]
      operationId: listLimitCatalog
      summary: List the limit catalog
      description: Returns the fixed catalog of limits a plan can set, with its unit and a Spanish label for display.
      x-required-permission: platform.plans.manage
      responses:
        '200':
          description: Limit catalog.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LimitInfo'
              examples:
                limits:
                  value:
                    - code: MAX_BRANCHES
                      label: Sedes
                      unit: COUNT
                    - code: MAX_STORAGE_MB
                      label: Almacenamiento
                      unit: MEGABYTES
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'

  # ------------------------------------------------------------------ Settings
  /platform/settings:
    get:
      tags: [Settings]
      operationId: getPlatformSettings
      summary: Get the platform settings
      description: Returns the configurable periods of the subscription lifecycle (plan D10).
      x-required-permission: platform.settings.manage
      responses:
        '200':
          description: Platform settings.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformSettings'
              examples:
                defaults:
                  $ref: '#/components/examples/DefaultSettings'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
    put:
      tags: [Settings]
      operationId: updatePlatformSettings
      summary: Update the platform settings
      description: |
        Replaces the platform settings. New values apply to periods computed from now
        on; dates already set on a subscription are not recomputed. Audited.
      x-required-permission: platform.settings.manage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlatformSettings'
            examples:
              defaults:
                $ref: '#/components/examples/DefaultSettings'
      responses:
        '200':
          description: Settings updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformSettings'
              examples:
                defaults:
                  $ref: '#/components/examples/DefaultSettings'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/VersionConflict'
        '500':
          $ref: '#/components/responses/InternalError'

  # ------------------------------------------------------------------ Tenants
  /platform/tenants:
    get:
      tags: [Tenants]
      operationId: listTenants
      summary: List clinics
      description: Returns a page of clinics with their plan and subscription status. Purged clinics are excluded.
      x-required-permission: platform.tenants.manage
      parameters:
        - name: q
          in: query
          required: false
          description: Case-insensitive search by legal name, trade name or RUC.
          schema:
            type: string
            maxLength: 120
        - name: status
          in: query
          required: false
          description: Filter by subscription status.
          schema:
            $ref: '#/components/schemas/SubscriptionStatus'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: A page of clinics.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantPage'
              examples:
                page:
                  value:
                    items:
                      - id: 5b0c8f2e-3a51-4d6e-9f0a-1c2b3d4e5f60
                        legalName: Example Clinic S.A.
                        tradeName: Example Clinic
                        ruc: '0000000000001'
                        clinicType: MEDICAL
                        planName: Standard
                        subscriptionStatus: ACTIVE
                        createdAt: '2030-01-01T15:00:00Z'
                    page: 0
                    size: 20
                    totalItems: 1
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [Tenants]
      operationId: createTenant
      summary: Onboard a clinic
      description: |
        Creates the clinic, its subscription and a one-time OWNER invitation in a
        single transaction, and emails the invitation (link valid for
        `ownerInvitationTtlHours`, 72 by default). With the trial plan the
        subscription starts in `TRIAL` for `trialDays`; with a paid plan it starts in
        `ACTIVE` with a period from now (plan D4). The plan must be active
        (`PLAN_ARCHIVED`). The RUC has 13 digits and is unique among non-purged
        clinics (`RUC_ALREADY_REGISTERED`). Missing data responds `400` naming each
        field. Audited; the RUC and emails never reach the logs.
      x-required-permission: platform.tenants.manage
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTenantRequest'
            examples:
              medical:
                value:
                  legalName: Example Clinic S.A.
                  tradeName: Example Clinic
                  ruc: '0000000000001'
                  clinicType: MEDICAL
                  countryCode: EC
                  city: Quito
                  address: 123 Example Avenue
                  phone: '+593000000000'
                  contactEmail: contact@example.com
                  mspEstablishmentNumber: null
                  planId: 3f2e1d0c-9b8a-4c7d-8e6f-5a4b3c2d1e0f
                  billingPeriod: MONTHLY
                  owner:
                    fullName: Jane Doe
                    email: jane.doe@example.com
      responses:
        '201':
          description: Clinic created and invitation sent.
          headers:
            Location:
              $ref: '#/components/headers/Location'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tenant'
              examples:
                created:
                  $ref: '#/components/examples/Tenant'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: The plan does not exist (`NOT_FOUND`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                notFound:
                  value:
                    type: about:blank
                    title: Not Found
                    status: 404
                    code: NOT_FOUND
        '409':
          description: |
            The RUC is already registered (`RUC_ALREADY_REGISTERED`), the plan is
            archived (`PLAN_ARCHIVED`), the idempotency key was reused with another
            body (`IDEMPOTENCY_KEY_REUSED`) or the client id is taken
            (`RESOURCE_ID_TAKEN`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                rucTaken:
                  value:
                    type: about:blank
                    title: Conflict
                    status: 409
                    code: RUC_ALREADY_REGISTERED
                planArchived:
                  value:
                    type: about:blank
                    title: Conflict
                    status: 409
                    code: PLAN_ARCHIVED
        '500':
          $ref: '#/components/responses/InternalError'

  /platform/tenants/{tenantId}:
    parameters:
      - $ref: '#/components/parameters/TenantId'
    get:
      tags: [Tenants]
      operationId: getTenant
      summary: Get a clinic
      description: Returns the clinic data, its subscription summary and the state of its OWNER onboarding. Never includes clinical data.
      x-required-permission: platform.tenants.manage
      responses:
        '200':
          description: The clinic.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tenant'
              examples:
                tenant:
                  $ref: '#/components/examples/Tenant'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    patch:
      tags: [Tenants]
      operationId: updateTenant
      summary: Update a clinic
      description: |
        Updates the clinic data (JSON merge patch semantics: only the sent fields
        change; `null` clears an optional field). The plan and the subscription change
        through their own operations. Purged clinics respond `404`. Audited.
      x-required-permission: platform.tenants.manage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTenantRequest'
            examples:
              phone:
                value:
                  phone: '+593000000001'
                  version: 2
      responses:
        '200':
          description: Clinic updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tenant'
              examples:
                tenant:
                  $ref: '#/components/examples/Tenant'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: The new RUC is already registered (`RUC_ALREADY_REGISTERED`) or the version is stale (`VERSION_CONFLICT`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                rucTaken:
                  value:
                    type: about:blank
                    title: Conflict
                    status: 409
                    code: RUC_ALREADY_REGISTERED
        '500':
          $ref: '#/components/responses/InternalError'

  /platform/tenants/{tenantId}/owner-invitations:
    parameters:
      - $ref: '#/components/parameters/TenantId'
    post:
      tags: [Tenants]
      operationId: resendOwnerInvitation
      summary: Resend the OWNER invitation
      description: |
        Issues a new one-time OWNER invitation and emails it; the previous one is
        revoked at once. Allowed only while the OWNER has not accepted
        (`ACCOUNT_ALREADY_ACTIVE`). The email can be corrected in the request.
        Audited.
      x-required-permission: platform.tenants.manage
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResendOwnerInvitationRequest'
            examples:
              sameEmail:
                value: {}
              correctedEmail:
                value:
                  email: jane.doe@example.org
      responses:
        '201':
          description: Invitation sent.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OwnerInvitation'
              examples:
                sent:
                  $ref: '#/components/examples/PendingInvitation'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: The OWNER already accepted (`ACCOUNT_ALREADY_ACTIVE`) or the idempotency key was reused (`IDEMPOTENCY_KEY_REUSED`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                alreadyActive:
                  value:
                    type: about:blank
                    title: Conflict
                    status: 409
                    code: ACCOUNT_ALREADY_ACTIVE
        '500':
          $ref: '#/components/responses/InternalError'

  /platform/tenants/{tenantId}/owner/two-factor-reset:
    parameters:
      - $ref: '#/components/parameters/TenantId'
    post:
      tags: [Tenants]
      operationId: resetOwnerTwoFactor
      summary: Reset the second factor of the OWNER
      description: |
        Disables the TOTP second factor of the clinic OWNER after a verified support
        request (plan D7). The OWNER must enroll again on the next login. A reason is
        mandatory and audited.
      x-required-permission: platform.tenants.manage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReasonRequest'
            examples:
              lostDevice:
                value:
                  reason: Owner lost the phone; identity verified by video call.
      responses:
        '204':
          description: Second factor reset.
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  # ------------------------------------------------------------------ Subscriptions
  /platform/tenants/{tenantId}/subscription:
    parameters:
      - $ref: '#/components/parameters/TenantId'
    get:
      tags: [Subscriptions]
      operationId: getTenantSubscription
      summary: Get the subscription of a clinic
      description: |
        Returns the subscription with its contracted price, period dates, the
        scheduled plan change, the price lock, the history of contracted periods and
        transitions, the allowed manual targets and whether it can still be
        reactivated from `CANCELLED` (ADR-016).
      x-required-permission: platform.tenants.manage
      responses:
        '200':
          description: The subscription.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Subscription'
              examples:
                active:
                  $ref: '#/components/examples/ActiveSubscription'
                cancelled:
                  $ref: '#/components/examples/CancelledSubscription'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /platform/tenants/{tenantId}/subscription/plan-change-preview:
    parameters:
      - $ref: '#/components/parameters/TenantId'
    post:
      tags: [Subscriptions]
      operationId: previewPlanChange
      summary: Preview a plan change
      description: |
        Computes, without changing anything, the kind of change (plan D2), when it
        takes effect, the prorated amount of an upgrade (plan D3) and, for a
        downgrade, the current usage that exceeds the target plan limits and the
        modules that would be disabled.
      x-required-permission: platform.tenants.manage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlanChangeRequest'
            examples:
              downgrade:
                value:
                  targetPlanId: 3f2e1d0c-9b8a-4c7d-8e6f-5a4b3c2d1e0f
                  billingPeriod: MONTHLY
      responses:
        '200':
          description: Preview of the change.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlanChangePreview'
              examples:
                upgrade:
                  value:
                    kind: UPGRADE
                    targetPlan:
                      id: 9a8b7c6d-5e4f-4a3b-8c2d-1e0f9a8b7c6d
                      code: PREMIUM
                      name: Premium
                    billingPeriod: MONTHLY
                    effectiveAt: '2030-01-16T15:00:00Z'
                    proratedAmount: '25.00'
                    currency: USD
                    newPriceAmount: '99.00'
                    excess: []
                    disabledModules: []
                downgrade:
                  value:
                    kind: DOWNGRADE
                    targetPlan:
                      id: 3f2e1d0c-9b8a-4c7d-8e6f-5a4b3c2d1e0f
                      code: BASIC
                      name: Basic
                    billingPeriod: MONTHLY
                    effectiveAt: '2030-02-01T05:00:00Z'
                    proratedAmount: null
                    currency: USD
                    newPriceAmount: '29.00'
                    excess:
                      - limit: MAX_USERS
                        limitValue: 5
                        usage: 8
                    disabledModules: [PHARMACY]
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/PlanChangeConflict'
        '500':
          $ref: '#/components/responses/InternalError'

  /platform/tenants/{tenantId}/subscription/plan-changes:
    parameters:
      - $ref: '#/components/parameters/TenantId'
    post:
      tags: [Subscriptions]
      operationId: requestPlanChange
      summary: Change the plan of a clinic
      description: |
        Applies or schedules a plan change. An `UPGRADE` applies at once and records
        the prorated amount, published in the `PlanUpgraded` event for the billing
        epic. A `DOWNGRADE` or a billing period change (`PERIOD_CHANGE`) is scheduled
        for the next renewal, without refund; if the clinic still exceeds a limit
        then, it cannot create new resources of that kind (`PLAN_LIMIT_REACHED`) and
        nothing is deleted. A new request replaces a scheduled one. Allowed in
        `TRIAL`, `ACTIVE` and `PAST_DUE` (`PLAN_CHANGE_NOT_ALLOWED`). Audited.
      x-required-permission: platform.tenants.manage
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlanChangeRequest'
            examples:
              upgrade:
                value:
                  targetPlanId: 9a8b7c6d-5e4f-4a3b-8c2d-1e0f9a8b7c6d
                  billingPeriod: MONTHLY
                  version: 4
      responses:
        '201':
          description: Plan change applied (`APPLIED`) or scheduled (`SCHEDULED`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlanChange'
              examples:
                upgrade:
                  $ref: '#/components/examples/AppliedUpgrade'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/PlanChangeConflict'
        '500':
          $ref: '#/components/responses/InternalError'

  /platform/tenants/{tenantId}/subscription/transitions:
    parameters:
      - $ref: '#/components/parameters/TenantId'
    post:
      tags: [Subscriptions]
      operationId: transitionSubscription
      summary: Apply a manual subscription transition
      description: |
        Moves the subscription to `target` following the state machine (ADR-016):
        activation from `TRIAL` or `PAST_DUE`, suspension, cancellation requested by
        the clinic, reactivation from `SUSPENDED` and reactivation from `CANCELLED`.
        Any other transition responds `409` (`INVALID_SUBSCRIPTION_TRANSITION`).

        Reactivation from `CANCELLED` (plan D12) requires a non-blank `reason`, is
        allowed only while `retentionEndsAt` has not passed and the clinic is not
        purged (`REACTIVATION_WINDOW_CLOSED`), starts a new period from now at the
        current plan price (or the locked one) and cancels any pending purge request.
        A `PaymentReceived` event never reactivates a cancelled clinic.

        `reason` is optional for other transitions. Every transition is audited with
        the actor, cause and reason, and publishes `SubscriptionStatusChanged`.
      x-required-permission: platform.tenants.manage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransitionRequest'
            examples:
              suspend:
                value:
                  target: SUSPENDED
                  reason: Requested by the clinic owner.
                  version: 4
              reactivateCancelled:
                value:
                  target: ACTIVE
                  reason: Clinic paid the outstanding balance by bank transfer.
                  version: 7
      responses:
        '200':
          description: Transition applied.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Subscription'
              examples:
                active:
                  $ref: '#/components/examples/ActiveSubscription'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: |
            The transition is not allowed from the current status
            (`INVALID_SUBSCRIPTION_TRANSITION`), the retention window of a cancelled
            clinic is over or the clinic was purged (`REACTIVATION_WINDOW_CLOSED`), or
            the version is stale (`VERSION_CONFLICT`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                invalidTransition:
                  value:
                    type: about:blank
                    title: Conflict
                    status: 409
                    code: INVALID_SUBSCRIPTION_TRANSITION
                    detail: Transition from TRIAL to PAST_DUE is not allowed.
                windowClosed:
                  value:
                    type: about:blank
                    title: Conflict
                    status: 409
                    code: REACTIVATION_WINDOW_CLOSED
                    detail: The retention period ended on 2030-04-01.
        '500':
          $ref: '#/components/responses/InternalError'

  /platform/tenants/{tenantId}/subscription/price-lock:
    parameters:
      - $ref: '#/components/parameters/TenantId'
    put:
      tags: [Subscriptions]
      operationId: setPriceLock
      summary: Set or remove the price lock
      description: |
        Freezes the contracted price of the clinic until `lockedUntil` (inclusive):
        new price versions do not apply to it before that date. `null` removes the
        lock. Audited.
      x-required-permission: platform.tenants.manage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PriceLockRequest'
            examples:
              lock:
                value:
                  lockedUntil: '2030-12-31'
                  reason: Launch agreement.
                  version: 4
              unlock:
                value:
                  lockedUntil: null
                  version: 5
      responses:
        '200':
          description: Price lock updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Subscription'
              examples:
                active:
                  $ref: '#/components/examples/ActiveSubscription'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/VersionConflict'
        '500':
          $ref: '#/components/responses/InternalError'

  # ------------------------------------------------------------------ Purge
  /platform/tenants/{tenantId}/purge-requests:
    parameters:
      - $ref: '#/components/parameters/TenantId'
    post:
      tags: [Purge]
      operationId: requestTenantPurge
      summary: Request the purge of a clinic
      description: |
        First step of the double confirmation (plan D6, ADR-018). Allowed only for a
        `CANCELLED` clinic whose retention has ended and without another pending
        request (`PURGE_NOT_ALLOWED`). Nothing is deleted yet. Audited.
      x-required-permission: platform.tenants.purge
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePurgeRequest'
            examples:
              request:
                value:
                  reason: Retention ended; the clinic confirmed it downloaded its data.
      responses:
        '201':
          description: Purge requested.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurgeRequest'
              examples:
                requested:
                  value:
                    id: 7e6d5c4b-3a29-4180-9f7e-6d5c4b3a2918
                    status: REQUESTED
                    requestedAt: '2030-07-01T15:00:00Z'
                    confirmedAt: null
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/PurgeNotAllowed'
        '500':
          $ref: '#/components/responses/InternalError'

  /platform/tenants/{tenantId}/purge-requests/{requestId}/confirm:
    parameters:
      - $ref: '#/components/parameters/TenantId'
      - $ref: '#/components/parameters/PurgeRequestId'
    post:
      tags: [Purge]
      operationId: confirmTenantPurge
      summary: Confirm the purge of a clinic
      description: |
        Second step of the double confirmation: the SUPER_ADMIN types the clinic RUC.
        A mismatch responds `400` (`VALIDATION`, field `rucConfirmation`, code
        `MISMATCH`). The state is checked again (`PURGE_NOT_ALLOWED`). The purge runs
        asynchronously: each module deletes or anonymizes its own data
        (`TenantPurged`); clinical records are not purged until the legal retention
        period is validated (ADR-018). Audited.
      x-required-permission: platform.tenants.purge
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfirmPurgeRequest'
            examples:
              confirm:
                value:
                  rucConfirmation: '0000000000001'
      responses:
        '200':
          description: Purge confirmed and started.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurgeRequest'
              examples:
                confirmed:
                  value:
                    id: 7e6d5c4b-3a29-4180-9f7e-6d5c4b3a2918
                    status: CONFIRMED
                    requestedAt: '2030-07-01T15:00:00Z'
                    confirmedAt: '2030-07-02T15:00:00Z'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/PurgeNotAllowed'
        '500':
          $ref: '#/components/responses/InternalError'

  # ------------------------------------------------------------------ Owner onboarding (public)
  /public/owner-invitations/preview:
    post:
      tags: [Owner onboarding]
      operationId: previewOwnerInvitation
      summary: Preview an OWNER invitation
      description: |
        Returns the clinic name, the masked email and the versions of the terms and
        data policy to accept. The token travels in the body (ADR-014). Expired, used,
        revoked or unknown tokens respond `410` (`INVITATION_INVALID_OR_EXPIRED`).
      x-required-permission: public
      x-public: true
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OwnerInvitationTokenRequest'
            examples:
              preview:
                value:
                  token: one-time-example-token
      responses:
        '200':
          description: Valid invitation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OwnerInvitationPreview'
              examples:
                valid:
                  value:
                    clinicName: Example Clinic
                    ownerName: Jane Doe
                    maskedEmail: j***@example.com
                    expiresAt: '2030-01-04T15:00:00Z'
                    termsVersion: '2030-01'
                    dataPolicyVersion: '2030-01'
        '400':
          $ref: '#/components/responses/ValidationError'
        '410':
          $ref: '#/components/responses/InvitationGone'
        '429':
          $ref: '#/components/responses/TooManyAttempts'
        '500':
          $ref: '#/components/responses/InternalError'

  /public/owner-invitations/accept:
    post:
      tags: [Owner onboarding]
      operationId: acceptOwnerInvitation
      summary: Accept an OWNER invitation
      description: |
        Activates the OWNER account with the chosen password and records the
        acceptance of the terms and the data policy (the versions shown in the
        preview, with timestamp). The token is consumed. Returns tokens whose session
        still requires the second factor: the client continues with
        `POST /auth/two-factor/enrollment` (ADR-019). A weak password responds `400`
        (`WEAK_PASSWORD`) without consuming the token; outdated versions respond `400`
        (`VALIDATION`).
      x-required-permission: public
      x-public: true
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AcceptOwnerInvitationRequest'
            examples:
              accept:
                value:
                  token: one-time-example-token
                  password: a-long-example-passphrase
                  acceptTerms: true
                  termsVersion: '2030-01'
                  acceptDataPolicy: true
                  dataPolicyVersion: '2030-01'
      responses:
        '200':
          $ref: '#/components/responses/Session'
        '400':
          $ref: '#/components/responses/ValidationError'
        '410':
          $ref: '#/components/responses/InvitationGone'
        '429':
          $ref: '#/components/responses/TooManyAttempts'
        '500':
          $ref: '#/components/responses/InternalError'

  # ------------------------------------------------------------------ Two-factor
  /auth/two-factor/enrollment:
    post:
      tags: [Two-factor]
      operationId: startTwoFactorEnrollment
      summary: Start TOTP enrollment
      description: |
        Generates a new TOTP secret (RFC 6238: SHA-1, 6 digits, 30 seconds) for the
        current account and returns it with an `otpauth://` URI to render as a QR
        code. The secret is stored encrypted and stays inactive until confirmed;
        calling again replaces an unconfirmed secret. An account with the second
        factor already enabled responds `409` (`TWO_FACTOR_ALREADY_ENABLED`). The
        secret is shown only in this response and never logged.
      x-required-permission: authenticated
      responses:
        '200':
          description: Enrollment started.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TwoFactorEnrollment'
              examples:
                enrollment:
                  value:
                    secret: EXAMPLEEXAMPLEEXAMPLEEXAMPLE2345
                    otpauthUri: otpauth://totp/Medical%20Kuador:j***%40example.com?secret=EXAMPLEEXAMPLEEXAMPLEEXAMPLE2345&issuer=Medical%20Kuador&algorithm=SHA1&digits=6&period=30
                    issuer: Medical Kuador
                    digits: 6
                    period: 30
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '409':
          description: The second factor is already enabled (`TWO_FACTOR_ALREADY_ENABLED`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                alreadyEnabled:
                  value:
                    type: about:blank
                    title: Conflict
                    status: 409
                    code: TWO_FACTOR_ALREADY_ENABLED
        '500':
          $ref: '#/components/responses/InternalError'

  /auth/two-factor/enrollment/confirm:
    post:
      tags: [Two-factor]
      operationId: confirmTwoFactorEnrollment
      summary: Confirm TOTP enrollment
      description: |
        Enables the second factor when `code` matches the pending secret (window of
        ±1 step) and returns new tokens whose session has passed the second factor.
        A wrong code responds `400` (`TWO_FACTOR_CODE_INVALID`); repeated failures
        respond `429`. Audited.
      x-required-permission: authenticated
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TwoFactorCodeRequest'
            examples:
              confirm:
                value:
                  code: '123456'
      responses:
        '200':
          $ref: '#/components/responses/Session'
        '400':
          $ref: '#/components/responses/TwoFactorCodeError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '409':
          description: There is no pending enrollment, or the second factor is already enabled (`TWO_FACTOR_ALREADY_ENABLED`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                alreadyEnabled:
                  value:
                    type: about:blank
                    title: Conflict
                    status: 409
                    code: TWO_FACTOR_ALREADY_ENABLED
        '429':
          $ref: '#/components/responses/TooManyAttempts'
        '500':
          $ref: '#/components/responses/InternalError'

  /auth/two-factor/verify:
    post:
      tags: [Two-factor]
      operationId: verifyTwoFactor
      summary: Verify the second factor after login
      description: |
        Completes a login of an account with the second factor enabled: when `code`
        matches, returns new tokens whose session has passed the second factor. A
        code already used in the same time step is rejected. A wrong code responds
        `400` (`TWO_FACTOR_CODE_INVALID`); repeated failures respond `429`.
      x-required-permission: authenticated
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TwoFactorCodeRequest'
            examples:
              verify:
                value:
                  code: '123456'
      responses:
        '200':
          $ref: '#/components/responses/Session'
        '400':
          $ref: '#/components/responses/TwoFactorCodeError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '429':
          $ref: '#/components/responses/TooManyAttempts'
        '500':
          $ref: '#/components/responses/InternalError'

  # ------------------------------------------------------------------ Clinic subscription
  /tenant/subscription:
    get:
      tags: [Clinic subscription]
      operationId: getMySubscription
      summary: Get the subscription of the current clinic
      description: |
        Returns the status, access mode, plan, enabled modules, limits with current
        usage, scheduled changes and notices of the clinic resolved from the access
        token. Allowed in every access mode except `NONE`.
      x-required-permission: subscription.read
      responses:
        '200':
          description: Subscription of the current clinic.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClinicSubscription'
              examples:
                pastDue:
                  value:
                    status: PAST_DUE
                    accessMode: FULL
                    plan:
                      id: 3f2e1d0c-9b8a-4c7d-8e6f-5a4b3c2d1e0f
                      code: STANDARD
                      name: Standard
                    billingPeriod: MONTHLY
                    priceAmount: '49.00'
                    currency: USD
                    currentPeriodEnd: '2030-02-01T05:00:00Z'
                    trialEndsAt: null
                    graceEndsAt: '2030-02-08T05:00:00Z'
                    retentionEndsAt: null
                    modules: [AGENDA, PATIENTS, CLINICAL_RECORDS, CONSULTATION, USERS, NOTIFICATIONS]
                    limits:
                      - limit: MAX_USERS
                        limitValue: 15
                        usage: 8
                      - limit: MAX_BRANCHES
                        limitValue: 3
                        usage: 1
                    scheduledPlanChange: null
                    notices:
                      - kind: PAYMENT_OVERDUE
                        effectiveAt: '2030-02-08T05:00:00Z'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'

  /tenant/exports:
    post:
      tags: [Clinic subscription]
      operationId: requestTenantExport
      summary: Request a data export of the current clinic
      description: |
        Starts an export of the clinic data in the chosen format; each module adds its
        own data. The file is generated right after the request is recorded, so the
        response is usually already `READY` (or `FAILED`); clients poll
        `GET /tenant/exports/{exportId}` while it is `PENDING`. Allowed while the clinic
        is read-only (`SUSPENDED`, or `CANCELLED` during retention). The file is kept
        until `expiresAt` (7 days). Audited (who exported and when).
      x-required-permission: tenant.data.export
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateExportRequest'
            examples:
              json:
                value:
                  format: JSON
      responses:
        '202':
          description: Export accepted.
          headers:
            Location:
              $ref: '#/components/headers/Location'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantExport'
              examples:
                pending:
                  value:
                    id: 2c3d4e5f-6a7b-4c8d-9e0f-1a2b3c4d5e6f
                    format: JSON
                    status: PENDING
                    createdAt: '2030-07-01T15:00:00Z'
                    expiresAt: null
                    downloadUrl: null
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/IdempotencyConflict'
        '500':
          $ref: '#/components/responses/InternalError'

  /tenant/exports/{exportId}:
    parameters:
      - $ref: '#/components/parameters/ExportId'
    get:
      tags: [Clinic subscription]
      operationId: getTenantExport
      summary: Get a data export of the current clinic
      description: |
        Returns the status of an export. When `READY`, `downloadUrl` is a new signed
        URL, valid for 5 minutes, to download the file without an access token
        (`GET /public/tenant-exports/download`); each download is audited. Past
        `expiresAt` the export is `EXPIRED` and its file is deleted. Exports of another
        clinic respond `404`.
      x-required-permission: tenant.data.export
      responses:
        '200':
          description: The export.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantExport'
              examples:
                ready:
                  value:
                    id: 2c3d4e5f-6a7b-4c8d-9e0f-1a2b3c4d5e6f
                    format: JSON
                    status: READY
                    createdAt: '2030-07-01T15:00:00Z'
                    expiresAt: '2030-07-08T15:00:00Z'
                    downloadUrl: https://app.medical-kuador.invalid/api/v1/public/tenant-exports/download?grant=example-signed-grant
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /public/tenant-exports/download:
    get:
      tags: [Clinic subscription]
      operationId: downloadTenantExport
      summary: Download the file of a data export
      description: |
        Target of `downloadUrl` (MEDK-70): opened by the browser without an access
        token, like a presigned URL. The `grant` is opaque, signed by the API
        (HMAC-SHA256) and valid for 5 minutes; it names the clinic, the export and the
        account that obtained it, so the clinic never travels as a parameter of its
        own (ADR-007) and the download is audited with that account. `JSON` exports are
        one `application/json` document; `CSV` exports are an `application/zip` with
        one UTF-8 CSV file per section. An invalid, expired or tampered grant, an
        expired export or a purged clinic respond `404`. Never cached (`no-store`).
      x-required-permission: public
      x-public: true
      security: []
      parameters:
        - name: grant
          in: query
          required: true
          description: Signed grant taken from `downloadUrl`. Opaque; never logged.
          schema:
            type: string
            minLength: 1
            maxLength: 200
      responses:
        '200':
          description: The file, as an attachment.
          headers:
            Content-Disposition:
              description: '`attachment` with the file name, for example `kuador-medical-export-2030-07-01.json`.'
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                description: |
                  `format` (`kuador-medical-export`), `version`, `clinicId`, `generatedAt`
                  and `sections`: one array of rows per section, for example
                  `platform.clinic` or `platform.subscription`; each module adds its own.
            application/zip:
              schema:
                type: string
                format: binary
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Access token issued by the login operations of `user-registration.openapi.yaml`.
        `/platform/**` requires a `PLATFORM` token (SUPER_ADMIN); clinic operations
        require a `TENANT` token.

  headers:
    Location:
      description: URL of the created resource.
      schema:
        type: string
    RetryAfter:
      description: Seconds until a new attempt is allowed.
      schema:
        type: integer
        minimum: 1

  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: |
        Client-generated key (UUID recommended) that makes the creation safe to retry.
        Kept for 24 hours per caller and operation (configurable).
      schema:
        type: string
        minLength: 8
        maxLength: 64
        examples: [9b2d5f1e-7c3a-4e8b-a6d0-1f2e3d4c5b6a]
    Page:
      name: page
      in: query
      description: Zero-based page number.
      schema:
        type: integer
        minimum: 0
        default: 0
    Size:
      name: size
      in: query
      description: Page size.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    PlanId:
      name: planId
      in: path
      required: true
      description: Plan identifier.
      schema:
        type: string
        format: uuid
    TenantId:
      name: tenantId
      in: path
      required: true
      description: Clinic (tenant) identifier. Only platform operations accept it.
      schema:
        type: string
        format: uuid
    PurgeRequestId:
      name: requestId
      in: path
      required: true
      description: Purge request identifier.
      schema:
        type: string
        format: uuid
    ExportId:
      name: exportId
      in: path
      required: true
      description: Export identifier.
      schema:
        type: string
        format: uuid

