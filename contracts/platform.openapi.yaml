        currency: USD

  responses:
    Session:
      description: |
        Tokens of the session, with the same shape as a completed login
        (`AuthenticatedResult` of `user-registration.openapi.yaml`). After accepting
        the invitation the session still requires the second factor; after enrollment
        confirmation or verification it has passed it.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Session'
          examples:
            authenticated:
              value:
                status: AUTHENTICATED
                accessToken: eyJhbGciOiJIUzI1NiJ9.example.signature
                tokenType: Bearer
                expiresIn: 900
                refreshToken: refresh-example-token
                refreshExpiresIn: 604800
                scope: TENANT
                clinic:
                  id: 5b0c8f2e-3a51-4d6e-9f0a-1c2b3d4e5f60
                  name: Example Clinic
                branch: null
                mustChangePassword: false
    ValidationError:
      description: The request is malformed or breaks a validation rule (`VALIDATION`), with one error per field.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            validation:
              value:
                type: about:blank
                title: Bad Request
                status: 400
                code: VALIDATION
                errors:
                  - field: ruc
                    code: INVALID_FORMAT
                  - field: owner.email
                    code: REQUIRED
            weakPassword:
              value:
                type: about:blank
                title: Bad Request
                status: 400
                code: WEAK_PASSWORD
    TwoFactorCodeError:
      description: The TOTP code is wrong, expired or already used (`TWO_FACTOR_CODE_INVALID`), or malformed (`VALIDATION`).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            invalidCode:
              value:
                type: about:blank
                title: Bad Request
                status: 400
                code: TWO_FACTOR_CODE_INVALID
    InvitationGone:
      description: The OWNER invitation is expired, used, revoked by a newer one or unknown (`INVITATION_INVALID_OR_EXPIRED`).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            gone:
              value:
                type: about:blank
                title: Gone
                status: 410
                code: INVITATION_INVALID_OR_EXPIRED
    TooManyAttempts:
      description: Too many attempts; temporarily blocked (`TOO_MANY_ATTEMPTS`).
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            tooManyAttempts:
              value:
                type: about:blank
                title: Too Many Requests
                status: 429
                code: TOO_MANY_ATTEMPTS
    Unauthenticated:
      description: |
        The access token is missing, invalid or expired (`UNAUTHENTICATED`), or the
        OWNER session has not passed the second factor yet (`TWO_FACTOR_REQUIRED`,
        with `twoFactor` = `ENROLLMENT_REQUIRED` or `VERIFICATION_REQUIRED`).
      headers:
        WWW-Authenticate:
          description: Bearer challenge.
          schema:
            type: string
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            unauthenticated:
              value:
                type: about:blank
                title: Unauthorized
                status: 401
                code: UNAUTHENTICATED
            twoFactorRequired:
              value:
                type: about:blank
                title: Unauthorized
                status: 401
                code: TWO_FACTOR_REQUIRED
                twoFactor: VERIFICATION_REQUIRED
    Forbidden:
      description: |
        The caller lacks the required permission or uses a token of the wrong scope
        (`FORBIDDEN`), the module is not in the plan (`MODULE_NOT_IN_PLAN`) or the
        clinic is read-only (`TENANT_READ_ONLY`).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            forbidden:
              value:
                type: about:blank
                title: Forbidden
                status: 403
                code: FORBIDDEN
            readOnly:
              value:
                type: about:blank
                title: Forbidden
                status: 403
                code: TENANT_READ_ONLY
            moduleNotInPlan:
              value:
                type: about:blank
                title: Forbidden
                status: 403
                code: MODULE_NOT_IN_PLAN
    NotFound:
      description: The resource does not exist, the clinic was purged, or the resource belongs to another clinic (`NOT_FOUND`).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            notFound:
              value:
                type: about:blank
                title: Not Found
                status: 404
                code: NOT_FOUND
    VersionConflict:
      description: The resource changed since it was read (`VERSION_CONFLICT`).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            versionConflict:
              value:
                type: about:blank
                title: Conflict
                status: 409
                code: VERSION_CONFLICT
    IdempotencyConflict:
      description: Reused idempotency key with a different body (`IDEMPOTENCY_KEY_REUSED`) or client id already taken (`RESOURCE_ID_TAKEN`).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            keyReused:
              value:
                type: about:blank
                title: Conflict
                status: 409
                code: IDEMPOTENCY_KEY_REUSED
    PlanConflict:
      description: The plan is archived (`PLAN_ARCHIVED`), the version is stale (`VERSION_CONFLICT`) or the idempotency key was reused (`IDEMPOTENCY_KEY_REUSED`).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            archived:
              value:
                type: about:blank
                title: Conflict
                status: 409
                code: PLAN_ARCHIVED
            versionConflict:
              value:
                type: about:blank
                title: Conflict
                status: 409
                code: VERSION_CONFLICT
    PlanChangeConflict:
      description: |
        The subscription status does not allow a plan change, or the target is the
        current plan and period (`PLAN_CHANGE_NOT_ALLOWED`), the target plan is
        archived (`PLAN_ARCHIVED`) or the version is stale (`VERSION_CONFLICT`).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            notAllowed:
              value:
                type: about:blank
                title: Conflict
                status: 409
                code: PLAN_CHANGE_NOT_ALLOWED
                detail: Plan changes are not allowed while SUSPENDED.
    PurgeNotAllowed:
      description: |
        The clinic is not `CANCELLED`, its retention has not ended, another request is
        pending, or the request is not pending any more (`PURGE_NOT_ALLOWED`).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            notAllowed:
              value:
                type: about:blank
                title: Conflict
                status: 409
                code: PURGE_NOT_ALLOWED
                detail: The retention period ends on 2030-08-07.
    InternalError:
      description: Unexpected error (`INTERNAL_ERROR`). No internal details are exposed.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            internal:
              value:
                type: about:blank
                title: Internal Server Error
                status: 500
                code: INTERNAL_ERROR

  schemas:
    # ------------------------------------------------------------ Errors
    ErrorCode:
      type: string
      description: |
        Stable, machine-readable error code. Clients map it to a user-facing message.
        Superset of the `ErrorCode` of `user-registration.openapi.yaml`; the codes
        after `CONTACT_CHANNEL_UNAVAILABLE` are added by this contract.
      enum:
        - VALIDATION
        - EMAIL_TAKEN
        - INVALID_CREDENTIALS
        - WEAK_PASSWORD
        - UNAUTHENTICATED
        - FORBIDDEN
        - PASSWORD_CHANGE_REQUIRED
        - NOT_FOUND
        - ROLE_NAME_TAKEN
        - VERSION_CONFLICT
        - SYSTEM_ROLE_IMMUTABLE
        - ROLE_IN_USE
        - INTERNAL_ERROR
        - TOO_MANY_ATTEMPTS
        - INVALID_SESSION_TOKEN
        - ONE_TIME_TOKEN_INVALID
        - BRANCH_NOT_ASSIGNED
        - PRIVILEGE_ESCALATION
        - SELF_MODIFICATION_FORBIDDEN
        - LAST_OWNER
        - PLAN_LIMIT_REACHED
        - IDEMPOTENCY_KEY_REUSED
        - RESOURCE_ID_TAKEN
        - ACCOUNT_ALREADY_ACTIVE
        - PATIENT_DUPLICATE
        - MINOR_CANNOT_HAVE_ACCOUNT
        - ADULT_AUTHORIZATION_REQUIRED
        - LAST_LEGAL_GUARDIAN
        - CONTACT_CHANNEL_UNAVAILABLE
        - TENANT_READ_ONLY
        - MODULE_NOT_IN_PLAN
        - INVALID_SUBSCRIPTION_TRANSITION
        - REACTIVATION_WINDOW_CLOSED
        - INVITATION_INVALID_OR_EXPIRED
        - TWO_FACTOR_REQUIRED
        - TWO_FACTOR_CODE_INVALID
        - TWO_FACTOR_ALREADY_ENABLED
        - RUC_ALREADY_REGISTERED
        - PLAN_ARCHIVED
        - PLAN_CHANGE_NOT_ALLOWED
        - PURGE_NOT_ALLOWED

    Problem:
      type: object
      description: Problem Details (RFC 9457) extended with a stable `code`.
      required: [type, title, status, code]
      properties:
        type:
          type: string
          format: uri-reference
          description: Problem type URI; `about:blank` when no specific type applies.
          default: about:blank
        title:
          type: string
          description: Short summary of the problem type.
        status:
          type: integer
          minimum: 400
          maximum: 599
          description: HTTP status code.
        detail:
          type: string
          description: Explanation for developers. Never contains secrets, tokens or personal data.
        instance:
          type: string
          format: uri-reference
          description: URI of the specific occurrence.
        code:
          $ref: '#/components/schemas/ErrorCode'
        errors:
          type: array
          description: Field-level validation errors (only for `VALIDATION`).
          items:
            $ref: '#/components/schemas/FieldError'
        twoFactor:
          type: string
          description: Only for `TWO_FACTOR_REQUIRED`; tells the client whether to enroll or to verify.
          enum: [ENROLLMENT_REQUIRED, VERIFICATION_REQUIRED]

    FieldError:
      type: object
      required: [field, code]
      properties:
        field:
          type: string
          description: JSON path of the invalid field, for example `owner.email`.
        code:
          type: string
          description: |
            Stable validation code, for example `REQUIRED`, `TOO_LONG`, `INVALID_FORMAT`,
            `DUPLICATE`, `UNKNOWN_MODULE`, `UNKNOWN_LIMIT`, `IN_THE_PAST`, `MISMATCH` or
            `OUTDATED_VERSION`.
          examples: [REQUIRED, MISMATCH]

    # ------------------------------------------------------------ Shared
    Version:
      type: integer
      format: int64
      minimum: 0
      description: Optimistic locking version; send back the value read.

    ClientId:
      type: string
      format: uuid
      description: Optional client-generated identifier of the new resource.

    Money:
      type: string
      pattern: '^\d{1,10}\.\d{2}$'
      description: Amount without VAT, with exactly two decimals.
      examples: ['49.00']

    Currency:
      type: string
      pattern: '^[A-Z]{3}$'
      default: USD
      description: ISO 4217 currency code. Only `USD` is offered today.
      examples: [USD]

    Email:
      type: string
      format: email
      maxLength: 254

    Reason:
      type: string
      minLength: 1
      maxLength: 500
      description: Free-text reason kept in the audit trail. Must not contain clinical data.

    PageMetadata:
      type: object
      required: [page, size, totalItems]
      properties:
        page:
          type: integer
          minimum: 0
        size:
          type: integer
          minimum: 1
        totalItems:
          type: integer
          format: int64
          minimum: 0

    # ------------------------------------------------------------ Plans
    ModuleCode:
      type: string
      description: Module of the fixed catalog that a plan can enable (`ModuleCode` in the api).
      enum:
        - AGENDA
        - PATIENTS
        - CLINICAL_RECORDS
        - CONSULTATION
        - ODONTOGRAM
        - USERS
        - PHARMACY
        - WAREHOUSE
        - CASH_REGISTER
        - COLLECTIONS
        - NOTIFICATIONS
        - E_INVOICING
        - PUBLIC_API
        - ADVANCED_REPORTS

    LimitCode:
      type: string
      description: Limit of the fixed catalog (`LimitCode` in the api). Limits count tenant-wide totals.
      enum: [MAX_BRANCHES, MAX_USERS, MAX_PATIENTS, MAX_APPOINTMENTS, MAX_STORAGE_MB]

    PlanLimits:
      type: object
      description: Value per limit; `null` means unlimited. Every limit of the catalog is present in responses.
      additionalProperties: false
      properties:
        MAX_BRANCHES:
          $ref: '#/components/schemas/LimitValue'
        MAX_USERS:
          $ref: '#/components/schemas/LimitValue'
        MAX_PATIENTS:
          $ref: '#/components/schemas/LimitValue'
        MAX_APPOINTMENTS:
          $ref: '#/components/schemas/LimitValue'
        MAX_STORAGE_MB:
          $ref: '#/components/schemas/LimitValue'

    LimitValue:
      type: [integer, 'null']
      minimum: 0
      description: Maximum allowed; `null` means unlimited.

    BillingPeriod:
      type: string
      description: Billing period of a price. The model accepts more periods later (for example quarterly).
      enum: [MONTHLY, ANNUAL]

    PlanStatus:
      type: string
      enum: [ACTIVE, ARCHIVED]

    ModuleInfo:
      type: object
      required: [code, label]
      properties:
        code:
          $ref: '#/components/schemas/ModuleCode'
        label:
          type: string
          description: Spanish label for display.

    LimitInfo:
      type: object
      required: [code, label, unit]
      properties:
        code:
          $ref: '#/components/schemas/LimitCode'
        label:
          type: string
          description: Spanish label for display.
        unit:
          type: string
          enum: [COUNT, MEGABYTES]

    PlanPrice:
      type: object
      description: Immutable price version of a plan for one billing period (ADR-015).
      required: [id, billingPeriod, currency, amount, effectiveFrom, createdAt]
      properties:
        id:
          type: string
          format: uuid
        billingPeriod:
          $ref: '#/components/schemas/BillingPeriod'
        currency:
          $ref: '#/components/schemas/Currency'
        amount:
          $ref: '#/components/schemas/Money'
        effectiveFrom:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time

    PriceInput:
      type: object
      additionalProperties: false
      required: [billingPeriod, amount]
      properties:
        billingPeriod:
          $ref: '#/components/schemas/BillingPeriod'
        currency:
          $ref: '#/components/schemas/Currency'
        amount:
          $ref: '#/components/schemas/Money'

    CreatePlanPriceRequest:
      type: object
      additionalProperties: false
      required: [billingPeriod, amount, effectiveFrom]
      properties:
        billingPeriod:
          $ref: '#/components/schemas/BillingPeriod'
        currency:
          $ref: '#/components/schemas/Currency'
        amount:
          $ref: '#/components/schemas/Money'
        effectiveFrom:
          type: string
          format: date-time
          description: When the price starts to apply to new subscriptions; not in the past.
        id:
          $ref: '#/components/schemas/ClientId'

    PlanSummary:
      type: object
      required: [id, code, name]
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
        name:
          type: string

    Plan:
      type: object
      required: [id, code, name, trial, status, modules, limits, currentPrices, createdAt, updatedAt, version]
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
          description: Unique, stable code.
        name:
          type: string
        description:
          type: [string, 'null']
        trial:
          type: boolean
          description: True for the single trial plan (plan D9). It has no prices.
        status:
          $ref: '#/components/schemas/PlanStatus'
        modules:
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/ModuleCode'
        limits:
          $ref: '#/components/schemas/PlanLimits'
        currentPrices:
          type: array
          description: The price in force today for each billing period.
          items:
            $ref: '#/components/schemas/PlanPrice'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        version:
          $ref: '#/components/schemas/Version'

    CreatePlanRequest:
      type: object
      additionalProperties: false
      required: [code, name, trial, modules, limits]
      properties:
        id:
          $ref: '#/components/schemas/ClientId'
        code:
          type: string
          pattern: '^[A-Z][A-Z0-9_]{1,39}$'
        name:
          type: string
          minLength: 1
          maxLength: 80
        description:
          type: [string, 'null']
          maxLength: 500
        trial:
          type: boolean
        modules:
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/ModuleCode'
        limits:
          $ref: '#/components/schemas/PlanLimits'
        prices:
          type: array
          description: Initial prices, at most one per billing period; empty for the trial plan.
          items:
            $ref: '#/components/schemas/PriceInput'

    UpdatePlanRequest:
      type: object
      additionalProperties: false
      required: [name, modules, limits, version]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
        description:
          type: [string, 'null']
          maxLength: 500
        modules:
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/ModuleCode'
        limits:
          $ref: '#/components/schemas/PlanLimits'
        version:
          $ref: '#/components/schemas/Version'

    # ------------------------------------------------------------ Settings
    PlatformSettings:
      type: object
      additionalProperties: false
      description: Configurable periods of the lifecycle (plan D10). Defaults 14, 7, 90, 90, 72 and 30.
      required: [trialDays, graceDays, suspensionDaysBeforeCancel, retentionDays, ownerInvitationTtlHours, priceChangeNoticeDays, version]
      properties:
        trialDays:
          type: integer
          minimum: 1
          maximum: 365
        graceDays:
          type: integer
          minimum: 0
          maximum: 90
        suspensionDaysBeforeCancel:
          type: integer
          minimum: 1
          maximum: 365
        retentionDays:
          type: integer
          minimum: 1
          maximum: 3650
        ownerInvitationTtlHours:
          type: integer
          minimum: 1
          maximum: 720
        priceChangeNoticeDays:
          type: integer
          minimum: 0
          maximum: 365
        version:
          $ref: '#/components/schemas/Version'

    # ------------------------------------------------------------ Tenants
    Ruc:
      type: string
      pattern: '^\d{13}$'
      description: Ecuadorian taxpayer number, 13 digits; unique among non-purged clinics (plan D8). Never logged.

    ClinicType:
      type: string
      enum: [MEDICAL, DENTAL, MIXED]

    SubscriptionStatus:
      type: string
      description: |
        `TRIAL` (TRIAL), `ACTIVE` (ACTIVA), `PAST_DUE` (VENCIDA, grace period),
        `SUSPENDED` (SUSPENDIDA) and `CANCELLED` (CANCELADA).
      enum: [TRIAL, ACTIVE, PAST_DUE, SUSPENDED, CANCELLED]

    AccessMode:
      type: string
      description: |
        `FULL` within the plan; `READ_ONLY` (suspended: reads and export);
        `RETENTION` (cancelled within retention: reads and export for the OWNER);
        `NONE` (purged).
      enum: [FULL, READ_ONLY, RETENTION, NONE]

    OwnerInput:
      type: object
      additionalProperties: false
      required: [fullName, email]
      properties:
        fullName:
          type: string
          minLength: 1
          maxLength: 160
        email:
          $ref: '#/components/schemas/Email'

    CreateTenantRequest:
      type: object
      additionalProperties: false
      required: [legalName, ruc, clinicType, countryCode, city, address, phone, contactEmail, planId, billingPeriod, owner]
      properties:
        id:
          $ref: '#/components/schemas/ClientId'
        legalName:
          type: string
          minLength: 1
          maxLength: 200
        tradeName:
          type: [string, 'null']
          maxLength: 200
        ruc:
          $ref: '#/components/schemas/Ruc'
        clinicType:
          $ref: '#/components/schemas/ClinicType'
        countryCode:
          type: string
          pattern: '^[A-Z]{2}$'
          description: ISO 3166-1 alpha-2. Only `EC` is offered today.
        city:
          type: string
          minLength: 1
          maxLength: 120
        address:
          type: string
          minLength: 1
          maxLength: 300
        phone:
          type: string
          minLength: 7
          maxLength: 20
        contactEmail:
          $ref: '#/components/schemas/Email'
        mspEstablishmentNumber:
          type: [string, 'null']
          maxLength: 40
        planId:
          type: string
          format: uuid
        billingPeriod:
          $ref: '#/components/schemas/BillingPeriod'
        owner:
          $ref: '#/components/schemas/OwnerInput'

    UpdateTenantRequest:
      type: object
      additionalProperties: false
      required: [version]
      properties:
        legalName:
          type: string
          minLength: 1
          maxLength: 200
        tradeName:
          type: [string, 'null']
          maxLength: 200
        ruc:
          $ref: '#/components/schemas/Ruc'
        clinicType:
          $ref: '#/components/schemas/ClinicType'
        countryCode:
          type: string
          pattern: '^[A-Z]{2}$'
        city:
          type: string
          minLength: 1
          maxLength: 120
        address:
          type: string
          minLength: 1
          maxLength: 300
        phone:
          type: string
          minLength: 7
          maxLength: 20
        contactEmail:
          $ref: '#/components/schemas/Email'
        mspEstablishmentNumber:
          type: [string, 'null']
          maxLength: 40
        version:
          $ref: '#/components/schemas/Version'

    InvitationStatus:
      type: string
      enum: [PENDING, ACCEPTED, EXPIRED, REVOKED]

    OwnerInvitation:
      type: object
      required: [status, maskedEmail, sentAt, expiresAt]
      properties:
        status:
          $ref: '#/components/schemas/InvitationStatus'
        maskedEmail:
          type: string
        sentAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time

    ResendOwnerInvitationRequest:
      type: object
      additionalProperties: false
      properties:
        id:
          $ref: '#/components/schemas/ClientId'
        email:
          $ref: '#/components/schemas/Email'

    TenantOwner:
      type: object
      required: [fullName, maskedEmail, twoFactorEnabled, invitation]
      properties:
        fullName:
          type: string
        maskedEmail:
          type: string
        twoFactorEnabled:
          type: boolean
        invitation:
          oneOf:
            - $ref: '#/components/schemas/OwnerInvitation'
            - type: 'null'
          description: Latest invitation; null once there is none to show.

    TenantSubscriptionSummary:
      type: object
      required: [status, planId, planName, billingPeriod, currentPeriodEnd, trialEndsAt]
      properties:
        status:
          $ref: '#/components/schemas/SubscriptionStatus'
        planId:
          type: string
          format: uuid
        planName:
          type: string
        billingPeriod:
          $ref: '#/components/schemas/BillingPeriod'
        currentPeriodEnd:
          type: [string, 'null']
          format: date-time
        trialEndsAt:
          type: [string, 'null']
          format: date-time

    Tenant:
      type: object
      required: [id, legalName, ruc, clinicType, countryCode, city, address, phone, contactEmail, owner, subscription, createdAt, version]
      properties:
        id:
          type: string
          format: uuid
        legalName:
          type: string
        tradeName:
          type: [string, 'null']
        ruc:
          $ref: '#/components/schemas/Ruc'
        clinicType:
          $ref: '#/components/schemas/ClinicType'
        countryCode:
          type: string
        city:
          type: string
        address:
          type: string
        phone:
          type: string
        contactEmail:
          $ref: '#/components/schemas/Email'
        mspEstablishmentNumber:
          type: [string, 'null']
        owner:
          $ref: '#/components/schemas/TenantOwner'
        subscription:
          $ref: '#/components/schemas/TenantSubscriptionSummary'
        createdAt:
          type: string
          format: date-time
        version:
          $ref: '#/components/schemas/Version'

    TenantListItem:
      type: object
      required: [id, legalName, ruc, clinicType, planName, subscriptionStatus, createdAt]
      properties:
        id:
          type: string
          format: uuid
        legalName:
          type: string
        tradeName:
          type: [string, 'null']
        ruc:
          $ref: '#/components/schemas/Ruc'
        clinicType:
          $ref: '#/components/schemas/ClinicType'
        planName:
          type: string
        subscriptionStatus:
          $ref: '#/components/schemas/SubscriptionStatus'
        createdAt:
          type: string
          format: date-time

    TenantPage:
      allOf:
        - $ref: '#/components/schemas/PageMetadata'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/TenantListItem'

    ReasonRequest:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason:
          $ref: '#/components/schemas/Reason'

    # ------------------------------------------------------------ Subscriptions
    TransitionCause:
      type: string
      enum: [MANUAL, PAYMENT_RECEIVED, PAYMENT_FAILED, SCHEDULER]

    SubscriptionTransition:
      type: object
      required: [from, to, cause, actor, reason, at]
      properties:
        from:
          oneOf:
            - $ref: '#/components/schemas/SubscriptionStatus'
            - type: 'null'
          description: Null for the initial status at onboarding.
        to:
          $ref: '#/components/schemas/SubscriptionStatus'
        cause:
          $ref: '#/components/schemas/TransitionCause'
        actor:
          type: [string, 'null']
          description: Display name of the SUPER_ADMIN for manual transitions; null otherwise.
        reason:
          type: [string, 'null']
        at:
          type: string
          format: date-time

    SubscriptionPeriod:
      type: object
      description: Contracted price of one period (ADR-015).
      required: [planName, periodStart, periodEnd, amount, currency]
      properties:
        planName:
          type: string
        periodStart:
          type: string
          format: date-time
        periodEnd:
          type: string
          format: date-time
        amount:
          $ref: '#/components/schemas/Money'
        currency:
          $ref: '#/components/schemas/Currency'

    PlanChangeKind:
      type: string
      description: '`UPGRADE` (higher price, same period), `DOWNGRADE` (lower or equal price) or `PERIOD_CHANGE` (other billing period), plan D2.'
      enum: [UPGRADE, DOWNGRADE, PERIOD_CHANGE]

    PlanChangeStatus:
      type: string
      enum: [SCHEDULED, APPLIED, CANCELLED]

    PlanChange:
      type: object
      required: [id, kind, status, fromPlan, toPlan, billingPeriod, requestedAt, effectiveAt, proratedAmount, currency]
      properties:
        id:
          type: string
          format: uuid
        kind:
          $ref: '#/components/schemas/PlanChangeKind'
        status:
          $ref: '#/components/schemas/PlanChangeStatus'
        fromPlan:
          $ref: '#/components/schemas/PlanSummary'
        toPlan:
          $ref: '#/components/schemas/PlanSummary'
        billingPeriod:
          $ref: '#/components/schemas/BillingPeriod'
        requestedAt:
          type: string
          format: date-time
        effectiveAt:
          type: string
          format: date-time
        proratedAmount:
          oneOf:
            - $ref: '#/components/schemas/Money'
            - type: 'null'
          description: Only for `UPGRADE`; (new − contracted) × remaining days ÷ period days, HALF_UP (plan D3).
        currency:
          $ref: '#/components/schemas/Currency'

    LimitExcess:
      type: object
      required: [limit, limitValue, usage]
      properties:
        limit:
          $ref: '#/components/schemas/LimitCode'
        limitValue:
          type: integer
          minimum: 0
        usage:
          type: integer
          minimum: 0

    PlanChangeRequest:
      type: object
      additionalProperties: false
      required: [targetPlanId, billingPeriod]
      properties:
        id:
          $ref: '#/components/schemas/ClientId'
        targetPlanId:
          type: string
          format: uuid
        billingPeriod:
          $ref: '#/components/schemas/BillingPeriod'
        version:
          $ref: '#/components/schemas/Version'

    PlanChangePreview:
      type: object
      required: [kind, targetPlan, billingPeriod, effectiveAt, proratedAmount, currency, newPriceAmount, excess, disabledModules]
      properties:
        kind:
          $ref: '#/components/schemas/PlanChangeKind'
        targetPlan:
          $ref: '#/components/schemas/PlanSummary'
        billingPeriod:
          $ref: '#/components/schemas/BillingPeriod'
        effectiveAt:
          type: string
          format: date-time
        proratedAmount:
          oneOf:
            - $ref: '#/components/schemas/Money'
            - type: 'null'
        currency:
          $ref: '#/components/schemas/Currency'
        newPriceAmount:
          $ref: '#/components/schemas/Money'
        excess:
          type: array
          description: Current usage above the target limits; empty when the clinic complies.
          items:
            $ref: '#/components/schemas/LimitExcess'
        disabledModules:
          type: array
          description: Modules of the current plan that the target plan does not include.
          items:
            $ref: '#/components/schemas/ModuleCode'

    Subscription:
      type: object
      required:
        - id
        - status
        - accessMode
        - plan
        - billingPeriod
        - priceAmount
        - currency
        - currentPeriodStart
        - currentPeriodEnd
        - trialEndsAt
        - graceEndsAt
        - suspendedAt
        - cancelledAt
        - retentionEndsAt
        - reactivatedAt
        - priceLockedUntil
        - purged
        - reactivable
        - allowedTargets
        - scheduledPlanChange
        - periods
        - transitions
        - version
      properties:
        id:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/SubscriptionStatus'
        accessMode:
          $ref: '#/components/schemas/AccessMode'
        plan:
          $ref: '#/components/schemas/PlanSummary'
        billingPeriod:
          $ref: '#/components/schemas/BillingPeriod'
        priceAmount:
          oneOf:
            - $ref: '#/components/schemas/Money'
            - type: 'null'
          description: Contracted price of the current period (snapshot, ADR-015); null during the trial.
        currency:
          $ref: '#/components/schemas/Currency'
        currentPeriodStart:
          type: [string, 'null']
          format: date-time
        currentPeriodEnd:
          type: [string, 'null']
          format: date-time
        trialEndsAt:
          type: [string, 'null']
          format: date-time
        graceEndsAt:
          type: [string, 'null']
          format: date-time
        suspendedAt:
          type: [string, 'null']
          format: date-time
        cancelledAt:
          type: [string, 'null']
          format: date-time
        retentionEndsAt:
          type: [string, 'null']
          format: date-time
        reactivatedAt:
          type: [string, 'null']
          format: date-time
        priceLockedUntil:
          type: [string, 'null']
          format: date
        purged:
          type: boolean
        reactivable:
          type: boolean
          description: True when the status is `CANCELLED`, the retention has not ended and the clinic is not purged (plan D12).
        allowedTargets:
          type: array
          description: Statuses reachable now through `POST .../subscription/transitions`.
          items:
            $ref: '#/components/schemas/SubscriptionStatus'
        scheduledPlanChange:
          oneOf:
            - $ref: '#/components/schemas/PlanChange'
            - type: 'null'
        periods:
          type: array
          description: Contracted periods, newest first.
          items:
            $ref: '#/components/schemas/SubscriptionPeriod'
        transitions:
          type: array
          description: Transitions, newest first.
          items:
            $ref: '#/components/schemas/SubscriptionTransition'
        version:
          $ref: '#/components/schemas/Version'

    TransitionRequest:
      type: object
      additionalProperties: false
      required: [target, version]
      properties:
        target:
          $ref: '#/components/schemas/SubscriptionStatus'
        reason:
          $ref: '#/components/schemas/Reason'
          description: Mandatory to reactivate a `CANCELLED` subscription.
        version:
          $ref: '#/components/schemas/Version'

    PriceLockRequest:
      type: object
      additionalProperties: false
      required: [lockedUntil, version]
      properties:
        lockedUntil:
          type: [string, 'null']
          format: date
          description: Last day of the lock (America/Guayaquil); null removes it.
        reason:
          $ref: '#/components/schemas/Reason'
        version:
          $ref: '#/components/schemas/Version'

    # ------------------------------------------------------------ Purge
    PurgeRequestStatus:
      type: string
      enum: [REQUESTED, CONFIRMED, CANCELLED]

    PurgeRequest:
      type: object
      required: [id, status, requestedAt, confirmedAt]
      properties:
        id:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/PurgeRequestStatus'
        requestedAt:
          type: string
          format: date-time
        confirmedAt:
          type: [string, 'null']
          format: date-time

    CreatePurgeRequest:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        id:
          $ref: '#/components/schemas/ClientId'
        reason:
          $ref: '#/components/schemas/Reason'

    ConfirmPurgeRequest:
      type: object
      additionalProperties: false
      required: [rucConfirmation]
      properties:
        rucConfirmation:
          $ref: '#/components/schemas/Ruc'

    # ------------------------------------------------------------ Owner onboarding
    OneTimeToken:
      type: string
      minLength: 16
      maxLength: 512
      writeOnly: true
      description: One-time token taken from the URL fragment of the link (ADR-014). Never logged.

    OwnerInvitationTokenRequest:
      type: object
      additionalProperties: false
      required: [token]
      properties:
        token:
          $ref: '#/components/schemas/OneTimeToken'

    OwnerInvitationPreview:
      type: object
      required: [clinicName, ownerName, maskedEmail, expiresAt, termsVersion, dataPolicyVersion]
      properties:
        clinicName:
          type: string
        ownerName:
          type: string
        maskedEmail:
          type: string
          description: Email with most of the local part hidden, for example `j***@example.com`.
        expiresAt:
          type: string
          format: date-time
        termsVersion:
          type: string
          description: Version of the terms of service to accept; the text is versioned content provided by Kuador.
        dataPolicyVersion:
          type: string
          description: Version of the data processing policy to accept.

    AcceptOwnerInvitationRequest:
      type: object
      additionalProperties: false
      required: [token, password, acceptTerms, termsVersion, acceptDataPolicy, dataPolicyVersion]
      properties:
        token:
          $ref: '#/components/schemas/OneTimeToken'
        password:
          type: string
          format: password
          maxLength: 128
          writeOnly: true
          description: New password; the policy is enforced as `WEAK_PASSWORD`.
        acceptTerms:
          type: boolean
          const: true
        termsVersion:
          type: string
          maxLength: 40
        acceptDataPolicy:
          type: boolean
          const: true
        dataPolicyVersion:
          type: string
          maxLength: 40

    Session:
      type: object
      description: Same shape as `AuthenticatedResult` of `user-registration.openapi.yaml`.
      required: [status, accessToken, tokenType, expiresIn, refreshToken, refreshExpiresIn, scope, mustChangePassword]
      properties:
        status:
          type: string
          const: AUTHENTICATED
        accessToken:
          type: string
        tokenType:
          type: string
          const: Bearer
        expiresIn:
          type: integer
          minimum: 1
        refreshToken:
          type: string
        refreshExpiresIn:
          type: integer
          minimum: 1
        scope:
          type: string
          enum: [TENANT, PLATFORM]
        clinic:
          type: object
          required: [id, name]
          properties:
            id:
              type: string
              format: uuid
            name:
              type: string
        branch:
          oneOf:
            - type: object
              required: [id, name]
              properties:
                id:
                  type: string
                  format: uuid
                name:
                  type: string
            - type: 'null'
        mustChangePassword:
          type: boolean

    # ------------------------------------------------------------ Two-factor
    TwoFactorEnrollment:
      type: object
      required: [secret, otpauthUri, issuer, digits, period]
      properties:
        secret:
          type: string
          pattern: '^[A-Z2-7]+=*$'
          description: Base32 TOTP secret, shown only once for manual entry.
        otpauthUri:
          type: string
          description: '`otpauth://totp/...` URI to render as a QR code.'
        issuer:
          type: string
        digits:
          type: integer
          const: 6
        period:
          type: integer
          const: 30

    TwoFactorCodeRequest:
      type: object
      additionalProperties: false
      required: [code]
      properties:
        code:
          type: string
          pattern: '^\d{6}$'
          writeOnly: true

    # ------------------------------------------------------------ Clinic subscription
    LimitUsage:
      type: object
      required: [limit, limitValue, usage]
      properties:
        limit:
          $ref: '#/components/schemas/LimitCode'
        limitValue:
          $ref: '#/components/schemas/LimitValue'
        usage:
          type: [integer, 'null']
          minimum: 0
          description: Current usage; null while the owning module does not report it yet.

    NoticeKind:
      type: string
      description: Notice to show to the clinic.
      enum: [TRIAL_ENDING, PAYMENT_OVERDUE, SUSPENDED, CANCELLED, PRICE_CHANGE, DOWNGRADE_EXCESS]

    Notice:
      type: object
      required: [kind, effectiveAt]
      properties:
        kind:
          $ref: '#/components/schemas/NoticeKind'
        effectiveAt:
          type: [string, 'null']
          format: date-time
          description: When the noticed change happens (end of trial, of grace, of retention, new price or downgrade).

    ClinicSubscription:
      type: object
      required: [status, accessMode, plan, billingPeriod, priceAmount, currency, currentPeriodEnd, trialEndsAt, graceEndsAt, retentionEndsAt, modules, limits, scheduledPlanChange, notices]
      properties:
        status:
          $ref: '#/components/schemas/SubscriptionStatus'
        accessMode:
          $ref: '#/components/schemas/AccessMode'
        plan:
          $ref: '#/components/schemas/PlanSummary'
        billingPeriod:
          $ref: '#/components/schemas/BillingPeriod'
        priceAmount:
          oneOf:
            - $ref: '#/components/schemas/Money'
            - type: 'null'
        currency:
          $ref: '#/components/schemas/Currency'
        currentPeriodEnd:
          type: [string, 'null']
          format: date-time
        trialEndsAt:
          type: [string, 'null']
          format: date-time
        graceEndsAt:
          type: [string, 'null']
          format: date-time
        retentionEndsAt:
          type: [string, 'null']
          format: date-time
        modules:
          type: array
          items:
            $ref: '#/components/schemas/ModuleCode'
        limits:
          type: array
          items:
            $ref: '#/components/schemas/LimitUsage'
        scheduledPlanChange:
          oneOf:
            - $ref: '#/components/schemas/PlanChange'
            - type: 'null'
        notices:
          type: array
          items:
            $ref: '#/components/schemas/Notice'

    # ------------------------------------------------------------ Export
    ExportFormat:
      type: string
      enum: [JSON, CSV]

    ExportStatus:
      type: string
      enum: [PENDING, READY, FAILED, EXPIRED]

    CreateExportRequest:
      type: object
      additionalProperties: false
      required: [format]
      properties:
        id:
          $ref: '#/components/schemas/ClientId'
        format:
          $ref: '#/components/schemas/ExportFormat'

    TenantExport:
      type: object
      required: [id, format, status, createdAt, expiresAt, downloadUrl]
      properties:
        id:
          type: string
          format: uuid
        format:
          $ref: '#/components/schemas/ExportFormat'
        status:
          $ref: '#/components/schemas/ExportStatus'
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: [string, 'null']
          format: date-time
        downloadUrl:
          type: [string, 'null']
          format: uri
          description: Short-lived download URL, only when `READY`.
