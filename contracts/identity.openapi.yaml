openapi: 3.1.0
info:
  title: Medical Kuador Identity API
  version: 0.1.0
  summary: Platform and identity endpoints of the Medical Kuador skeleton.
  description: |
    Contract-first definition (ADR-011) of the platform and identity endpoints:
    system status, clinic self-signup, login, password change, current user,
    permission catalog and per-clinic role management.

    Cross-cutting rules:

    - **Tenant from the token only (ADR-007).** No request body, path or query
      parameter carries a tenant identifier. The tenant is resolved by the backend
      from the access token.
    - **Explicit permission, denied by default (ADR-008).** Every operation states
      its required permission in `x-required-permission` (`public`, `authenticated`
      or a permission code).
    - **Mandatory password change.** While the account has
      `mustChangePassword = true`, every operation other than `POST /auth/password`
      and `GET /me` responds `403` with code `PASSWORD_CHANGE_REQUIRED`.
    - **Scope separation.** A `PLATFORM` token on clinic endpoints and a `TENANT`
      token on `/platform/**` endpoints respond `403` with code `FORBIDDEN`.
    - **Cross-tenant resources** respond `404` (`NOT_FOUND`); their existence is
      never revealed.
    - **Errors** use Problem Details (RFC 9457) with a stable `code`; clients
      translate the `code` into a user-facing message.
  license:
    name: Proprietary
    identifier: LicenseRef-Kuador-Proprietary
servers:
  - url: /api/v1
    description: Same origin as the client (local, staging and production).
tags:
  - name: System
    description: System status.
  - name: Tenants
    description: Clinic (tenant) self-signup.
  - name: Auth
    description: Login and password management.
  - name: Me
    description: Current authenticated account.
  - name: Permissions
    description: Fixed permission catalog.
  - name: Roles
    description: Roles of the current clinic.
  - name: Platform
    description: Platform-level operations for the SUPER_ADMIN.
security:
  - bearerAuth: []
paths:
  /system/info:
    get:
      tags: [System]
      operationId: getSystemInfo
      summary: Get system status
      description: Returns the application name, version and the status of its database connection.
      x-required-permission: public
      security: []
      responses:
        '200':
          description: System status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemInfo'
              examples:
                up:
                  value:
                    name: medical-kuador-api
                    version: 0.1.0
                    status: UP
                    database: UP
        '500':
          $ref: '#/components/responses/InternalError'

  /tenants/signup:
    post:
      tags: [Tenants]
      operationId: signUpTenant
      summary: Self-signup of a clinic
      description: |
        Creates a clinic (tenant) and its owner account in a single transaction.
        The new tenant receives the system roles OWNER and ADMIN, both assigned to
        the person who signs up.
      x-required-permission: public
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TenantSignupRequest'
            examples:
              signup:
                value:
                  clinicName: Example Clinic
                  ownerDisplayName: Jane Doe
                  email: owner@example.com
                  password: a-long-example-passphrase
      responses:
        '201':
          description: Clinic created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantSignupResponse'
              examples:
                created:
                  value:
                    tenantId: 5b0c8f2e-3a51-4d6e-9f0a-1c2b3d4e5f60
        '400':
          $ref: '#/components/responses/ValidationError'
        '409':
          description: The email is already registered on the platform (`EMAIL_TAKEN`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                emailTaken:
                  value:
                    type: about:blank
                    title: Conflict
                    status: 409
                    code: EMAIL_TAKEN
        '500':
          $ref: '#/components/responses/InternalError'

  /auth/login:
    post:
      tags: [Auth]
      operationId: login
      summary: Log in with email and password
      description: |
        Returns a signed JWT access token (no refresh token in the skeleton).
        `scope` tells whether the account operates a clinic (`TENANT`) or the
        platform (`PLATFORM`).
      x-required-permission: public
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            examples:
              login:
                value:
                  email: owner@example.com
                  password: a-long-example-passphrase
      responses:
        '200':
          description: Authenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
              examples:
                tenant:
                  value:
                    accessToken: eyJhbGciOiJIUzI1NiJ9.example.signature
                    tokenType: Bearer
                    expiresIn: 1800
                    scope: TENANT
                    mustChangePassword: false
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/InvalidCredentials'
        '500':
          $ref: '#/components/responses/InternalError'

  /auth/password:
    post:
      tags: [Auth]
      operationId: changePassword
      summary: Change the password of the current account
      description: |
        Changes the password and clears `mustChangePassword`. The new password must
        have at least 12 characters and differ from the current one (configurable
        policy). Allowed while a password change is required. Tokens issued before
        the change remain valid until they expire.
      x-required-permission: authenticated
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
            examples:
              change:
                value:
                  currentPassword: the-current-passphrase
                  newPassword: a-brand-new-passphrase
      responses:
        '204':
          description: Password changed.
        '400':
          description: |
            The new password does not meet the policy (`WEAK_PASSWORD`) or the request
            is malformed (`VALIDATION`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                weakPassword:
                  value:
                    type: about:blank
                    title: Bad Request
                    status: 400
                    code: WEAK_PASSWORD
        '401':
          description: |
            The current password is wrong (`INVALID_CREDENTIALS`) or the token is
            missing, invalid or expired (`UNAUTHENTICATED`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                invalidCredentials:
                  value:
                    type: about:blank
                    title: Unauthorized
                    status: 401
                    code: INVALID_CREDENTIALS
        '500':
          $ref: '#/components/responses/InternalError'

  /me:
    get:
      tags: [Me]
      operationId: getCurrentAccount
      summary: Get the current account
      description: |
        Returns the authenticated account with its scope, clinic (only for
        `TENANT` scope), roles and effective permissions. Allowed while a password
        change is required.
      x-required-permission: authenticated
      responses:
        '200':
          description: Current account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentAccount'
              examples:
                owner:
                  value:
                    accountId: 0f1e2d3c-4b5a-4968-8776-655443322110
                    displayName: Jane Doe
                    scope: TENANT
                    tenant:
                      id: 5b0c8f2e-3a51-4d6e-9f0a-1c2b3d4e5f60
                      name: Example Clinic
                    roles: [OWNER, ADMIN]
                    permissions: [roles.read, roles.create, roles.update, roles.delete]
                    mustChangePassword: false
                superAdmin:
                  value:
                    accountId: 9a8b7c6d-5e4f-4321-8a9b-0c1d2e3f4a5b
                    displayName: Kuador
                    scope: PLATFORM
                    roles: [SUPER_ADMIN]
                    permissions: [platform.permissions.read]
                    mustChangePassword: true
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '500':
          $ref: '#/components/responses/InternalError'

  /permissions:
    get:
      tags: [Permissions]
      operationId: listAssignablePermissions
      summary: List permissions assignable to clinic roles
      description: Returns the clinic-scoped permissions of the fixed catalog. Platform permissions are never listed here.
      x-required-permission: roles.read
      responses:
        '200':
          description: Clinic-scoped permission catalog.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PermissionInfo'
              examples:
                catalog:
                  value:
                    - code: roles.read
                      scope: TENANT
                      description: View roles and the assignable permission catalog.
                    - code: roles.create
                      scope: TENANT
                      description: Create roles.
                    - code: roles.update
                      scope: TENANT
                      description: Update roles.
                    - code: roles.delete
                      scope: TENANT
                      description: Delete roles.
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'

  /roles:
    get:
      tags: [Roles]
      operationId: listRoles
      summary: List the roles of the current clinic
      description: Returns every role of the clinic resolved from the token, including the system roles OWNER and ADMIN.
      x-required-permission: roles.read
      responses:
        '200':
          description: Roles of the current clinic.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Role'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [Roles]
      operationId: createRole
      summary: Create a role in the current clinic
      description: |
        Creates a non-system role. Names are unique per clinic (case-insensitive).
        Permissions must belong to the clinic-scoped catalog; unknown or platform
        permissions respond `400` (`VALIDATION`).
      x-required-permission: roles.create
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRoleRequest'
            examples:
              reception:
                value:
                  name: Reception
                  description: Front desk staff.
                  permissions: [roles.read]
      responses:
        '201':
          description: Role created.
          headers:
            Location:
              description: URL of the created role.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Role'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: Another role of the clinic already has this name (`ROLE_NAME_TAKEN`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                nameTaken:
                  value:
                    type: about:blank
                    title: Conflict
                    status: 409
                    code: ROLE_NAME_TAKEN
        '500':
          $ref: '#/components/responses/InternalError'

  /roles/{id}:
    parameters:
      - $ref: '#/components/parameters/RoleId'
    get:
      tags: [Roles]
      operationId: getRole
      summary: Get a role of the current clinic
      description: Roles of other clinics respond `404`.
      x-required-permission: roles.read
      responses:
        '200':
          description: The role.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Role'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    put:
      tags: [Roles]
      operationId: updateRole
      summary: Update a role of the current clinic
      description: |
        Replaces name, description and permissions of a non-system role. `version`
        must match the current version of the role (optimistic locking); otherwise
        the request responds `409` (`VERSION_CONFLICT`). System roles respond `409`
        (`SYSTEM_ROLE_IMMUTABLE`).
      x-required-permission: roles.update
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateRoleRequest'
            examples:
              update:
                value:
                  name: Reception
                  description: Front desk and phone staff.
                  permissions: [roles.read]
                  version: 0
      responses:
        '200':
          description: Role updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Role'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: |
            Name already used in the clinic (`ROLE_NAME_TAKEN`), stale `version`
            (`VERSION_CONFLICT`) or system role (`SYSTEM_ROLE_IMMUTABLE`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                versionConflict:
                  value:
                    type: about:blank
                    title: Conflict
                    status: 409
                    code: VERSION_CONFLICT
                systemRole:
                  value:
                    type: about:blank
                    title: Conflict
                    status: 409
                    code: SYSTEM_ROLE_IMMUTABLE
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [Roles]
      operationId: deleteRole
      summary: Delete a role of the current clinic
      description: |
        Deletes a non-system role that is not assigned to any membership. System
        roles respond `409` (`SYSTEM_ROLE_IMMUTABLE`); assigned roles respond `409`
        (`ROLE_IN_USE`).
      x-required-permission: roles.delete
      responses:
        '204':
          description: Role deleted.
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: System role (`SYSTEM_ROLE_IMMUTABLE`) or role assigned to a membership (`ROLE_IN_USE`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                inUse:
                  value:
                    type: about:blank
                    title: Conflict
                    status: 409
                    code: ROLE_IN_USE
        '500':
          $ref: '#/components/responses/InternalError'

  /platform/permissions:
    get:
      tags: [Platform]
      operationId: listPlatformPermissions
      summary: List the full permission catalog
      description: Returns every permission of the catalog, clinic and platform scoped. Requires a `PLATFORM` token.
      x-required-permission: platform.permissions.read
      responses:
        '200':
          description: Full permission catalog.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PermissionInfo'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token returned by `POST /auth/login` (HS256, 30 minutes by default).

  parameters:
    RoleId:
      name: id
      in: path
      required: true
      description: Role identifier.
      schema:
        type: string
        format: uuid

  responses:
    ValidationError:
      description: The request is malformed or breaks a validation rule (`VALIDATION`).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            validation:
              value:
                type: about:blank
                title: Bad Request
                status: 400
                code: VALIDATION
                errors:
                  - field: name
                    code: REQUIRED
    InvalidCredentials:
      description: Email or password is wrong (`INVALID_CREDENTIALS`). The response does not reveal which one.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            invalidCredentials:
              value:
                type: about:blank
                title: Unauthorized
                status: 401
                code: INVALID_CREDENTIALS
    Unauthenticated:
      description: The access token is missing, invalid or expired (`UNAUTHENTICATED`).
      headers:
        WWW-Authenticate:
          description: Bearer challenge.
          schema:
            type: string
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            unauthenticated:
              value:
                type: about:blank
                title: Unauthorized
                status: 401
                code: UNAUTHENTICATED
    Forbidden:
      description: |
        The account lacks the required permission or uses the wrong scope
        (`FORBIDDEN`), or must change its password first (`PASSWORD_CHANGE_REQUIRED`).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            forbidden:
              value:
                type: about:blank
                title: Forbidden
                status: 403
                code: FORBIDDEN
            passwordChangeRequired:
              value:
                type: about:blank
                title: Forbidden
                status: 403
                code: PASSWORD_CHANGE_REQUIRED
    NotFound:
      description: The resource does not exist in the current clinic (`NOT_FOUND`).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            notFound:
              value:
                type: about:blank
                title: Not Found
                status: 404
                code: NOT_FOUND
    InternalError:
      description: Unexpected error (`INTERNAL_ERROR`). No internal details are exposed.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            internal:
              value:
                type: about:blank
                title: Internal Server Error
                status: 500
                code: INTERNAL_ERROR

  schemas:
    ErrorCode:
      type: string
      description: Stable, machine-readable error code. Clients map it to a user-facing message.
      enum:
        - VALIDATION
        - EMAIL_TAKEN
        - INVALID_CREDENTIALS
        - WEAK_PASSWORD
        - UNAUTHENTICATED
        - FORBIDDEN
        - PASSWORD_CHANGE_REQUIRED
        - NOT_FOUND
        - ROLE_NAME_TAKEN
        - VERSION_CONFLICT
        - SYSTEM_ROLE_IMMUTABLE
        - ROLE_IN_USE
        - INTERNAL_ERROR

    Problem:
      type: object
      description: Problem Details (RFC 9457) extended with a stable `code`.
      required: [type, title, status, code]
      properties:
        type:
          type: string
          format: uri-reference
          description: Problem type URI; `about:blank` when no specific type applies.
          default: about:blank
        title:
          type: string
          description: Short summary of the problem type.
        status:
          type: integer
          minimum: 400
          maximum: 599
          description: HTTP status code.
        detail:
          type: string
          description: Explanation for developers. Never contains secrets or personal data.
        instance:
          type: string
          format: uri-reference
          description: URI of the specific occurrence.
        code:
          $ref: '#/components/schemas/ErrorCode'
        errors:
          type: array
          description: Field-level validation errors (only for `VALIDATION`).
          items:
            $ref: '#/components/schemas/FieldError'

    FieldError:
      type: object
      required: [field, code]
      properties:
        field:
          type: string
          description: JSON path of the invalid field, for example `permissions[0]`.
        code:
          type: string
          description: Stable validation code, for example `REQUIRED`, `TOO_LONG`, `INVALID_FORMAT` or `UNKNOWN_PERMISSION`.
          examples: [REQUIRED, UNKNOWN_PERMISSION]

    SystemInfo:
      type: object
      required: [name, version, status, database]
      properties:
        name:
          type: string
          description: Application name.
        version:
          type: string
          description: Application version.
        status:
          $ref: '#/components/schemas/HealthStatus'
        database:
          $ref: '#/components/schemas/HealthStatus'

    HealthStatus:
      type: string
      enum: [UP, DOWN]

    AccountScope:
      type: string
      description: '`TENANT` for clinic staff, `PLATFORM` for the SUPER_ADMIN.'
      enum: [TENANT, PLATFORM]

    PermissionScope:
      type: string
      description: '`TENANT` permissions are assignable to clinic roles; `PLATFORM` permissions never are.'
      enum: [TENANT, PLATFORM]

    PermissionCode:
      type: string
      description: Code of a permission of the fixed catalog.
      pattern: '^[a-z]+(\.[a-z]+)+$'
      examples: [roles.read]

    PermissionInfo:
      type: object
      required: [code, scope, description]
      properties:
        code:
          $ref: '#/components/schemas/PermissionCode'
        scope:
          $ref: '#/components/schemas/PermissionScope'
        description:
          type: string
          description: Description of the permission.

    Email:
      type: string
      format: email
      maxLength: 254
      description: Email address; compared case-insensitively.

    TenantSignupRequest:
      type: object
      additionalProperties: false
      required: [clinicName, ownerDisplayName, email, password]
      properties:
        clinicName:
          type: string
          minLength: 1
          maxLength: 120
          description: Name of the clinic.
        ownerDisplayName:
          type: string
          minLength: 1
          maxLength: 120
          description: Display name of the person who signs up.
        email:
          $ref: '#/components/schemas/Email'
        password:
          type: string
          format: password
          minLength: 12
          maxLength: 128
          writeOnly: true
          description: Password of the owner account.

    TenantSignupResponse:
      type: object
      required: [tenantId]
      properties:
        tenantId:
          type: string
          format: uuid
          description: Identifier of the created clinic.

    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          $ref: '#/components/schemas/Email'
        password:
          type: string
          format: password
          minLength: 1
          maxLength: 128
          writeOnly: true

    LoginResponse:
      type: object
      required: [accessToken, tokenType, expiresIn, scope, mustChangePassword]
      properties:
        accessToken:
          type: string
          description: Signed JWT access token.
        tokenType:
          type: string
          const: Bearer
        expiresIn:
          type: integer
          minimum: 1
          description: Lifetime of the token in seconds.
        scope:
          $ref: '#/components/schemas/AccountScope'
        mustChangePassword:
          type: boolean
          description: When true, only `POST /auth/password` and `GET /me` are allowed.

    ChangePasswordRequest:
      type: object
      additionalProperties: false
      required: [currentPassword, newPassword]
      properties:
        currentPassword:
          type: string
          format: password
          minLength: 1
          maxLength: 128
          writeOnly: true
        newPassword:
          type: string
          format: password
          maxLength: 128
          writeOnly: true
          description: At least 12 characters and different from the current password (enforced as `WEAK_PASSWORD`).

    TenantSummary:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string

    CurrentAccount:
      type: object
      required: [accountId, displayName, scope, roles, permissions, mustChangePassword]
      properties:
        accountId:
          type: string
          format: uuid
        displayName:
          type: string
        scope:
          $ref: '#/components/schemas/AccountScope'
        tenant:
          $ref: '#/components/schemas/TenantSummary'
          description: Present only for `TENANT` scope.
        roles:
          type: array
          description: Names of the roles of the account (`SUPER_ADMIN` for the platform account).
          items:
            type: string
        permissions:
          type: array
          description: Effective permissions, resolved on every request.
          uniqueItems: true
          items:
            $ref: '#/components/schemas/PermissionCode'
        mustChangePassword:
          type: boolean

    RoleName:
      type: string
      minLength: 1
      maxLength: 80
      description: Role name, unique per clinic (case-insensitive).

    RoleDescription:
      type: [string, 'null']
      maxLength: 500
      description: Optional description of the role.

    RolePermissions:
      type: array
      description: Clinic-scoped permission codes of the catalog.
      uniqueItems: true
      items:
        $ref: '#/components/schemas/PermissionCode'

    Role:
      type: object
      required: [id, name, systemRole, permissions, version]
      properties:
        id:
          type: string
          format: uuid
        name:
          $ref: '#/components/schemas/RoleName'
        description:
          $ref: '#/components/schemas/RoleDescription'
        systemRole:
          type: boolean
          description: True for OWNER and ADMIN; system roles cannot be updated or deleted.
        permissions:
          $ref: '#/components/schemas/RolePermissions'
        version:
          type: integer
          format: int64
          minimum: 0
